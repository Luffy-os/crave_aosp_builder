name: PixelOS 17 • Redmi 14C 5G (flame)

on:
  workflow_dispatch:
    inputs:
      CLEAN_BUILD:
        description: "Clean Crave build"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

jobs:
  Start-Runner:
    name: Start Crave self-hosted runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runner helper
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Configure Crave
        run: |
          if [[ "${DCDEVSPACE}" == *1* ]]; then
            echo "Already inside a Crave devspace."
          else
            mkdir -p "${HOME}/bin"
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
            mv "${PWD}/crave" "${HOME}/bin/crave"
            sudo ln -sf "${HOME}/bin/crave" /usr/bin/crave
            envsubst < "${PWD}/crave.conf.sample" > "${PWD}/crave.conf"
            rm -f "${PWD}/crave.conf.sample"
          fi
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Start runner inside Crave devspace
        run: |
          crave ${{ secrets.CRAVE_FLAGS }} devspace -- '
            set -e
            if [ ! -f actions-runner/run.sh ]; then
              echo "ERROR: actions-runner/run.sh was not found."
              exit 1
            fi

            if tmux has-session -t ghactions 2>/dev/null; then
              echo "GitHub Actions runner is already running."
            else
              tmux new-session -d -s ghactions
              tmux send-keys -t ghactions "./actions-runner/run.sh" Enter
              echo "GitHub Actions runner started."
            fi
          '
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

  build:
    name: Build PixelOS 17 for flame
    needs: Start-Runner
    runs-on: self-hosted
    timeout-minutes: 1440
    concurrency:
      group: pixelos17-flame
      cancel-in-progress: false

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Verify Crave credentials
        run: |
          test -n "${{ secrets.CRAVE_USERNAME }}" || { echo "CRAVE_USERNAME missing"; exit 1; }
          test -n "${{ secrets.CRAVE_TOKEN }}" || { echo "CRAVE_TOKEN missing"; exit 1; }

      - name: Verify PixelOS Crave clone
        run: |
          test -d /crave-devspaces/PixelOS
          cd /crave-devspaces/PixelOS
          test -d .repo
          test -f build/envsetup.sh
          echo "PixelOS clone is present."
          echo "Project directory: $(pwd)"

      - name: Queue PixelOS build through Crave
        working-directory: /crave-devspaces/PixelOS
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
          CRAVE_FLAGS: ${{ secrets.CRAVE_FLAGS }}
          CLEAN_BUILD: ${{ github.event.inputs.CLEAN_BUILD }}
        run: |
          set -e

          if [ "$CLEAN_BUILD" = "yes" ]; then
            CLEAN="--clean"
          else
            CLEAN=""
          fi

          echo "PixelOS Project ID: 82"
          echo "Device: flame"
          echo "Target: custom_flame-cp2a-userdebug"
          echo "Build command: m pixelos"
          echo "No explicit -j flag will be used."

          crave $CRAVE_FLAGS run \
            --projectID 82 \
            --no-patch \
            $CLEAN \
            -- '
              set -e

              echo "=== PixelOS 17 / flame build ==="

              # The PixelOS Project 82 clone is already initialized.
              # Add the unofficial flame device sources through a local manifest.
              mkdir -p .repo/local_manifests

              cat > .repo/local_manifests/flame.xml <<'"'"'EOF'"'"'
              <?xml version="1.0" encoding="UTF-8"?>
              <manifest>
                <remote
                  name="github"
                  fetch="https://github.com/" />

                <project
                  path="device/xiaomi/flame"
                  name="flame4blame/android_device_xiaomi_flame"
                  revision="lineage-24.0"
                  remote="github" />

                <project
                  path="device/xiaomi/flame-kernel"
                  name="flame4blame/android_device_xiaomi_flame-kernel"
                  revision="lineage-24.0"
                  remote="github" />

                <project
                  path="vendor/xiaomi/flame"
                  name="flame4blame/proprietary_vendor_xiaomi_flame"
                  revision="lineage-24.0"
                  remote="github" />
              </manifest>
              EOF

              echo "=== Local manifest ==="
              cat .repo/local_manifests/flame.xml

              echo "=== Syncing only through Crave build environment ==="
              if [ -f /usr/bin/resync ]; then
                /usr/bin/resync
              else
                /opt/crave/resync.sh
              fi

              echo "=== Preflight: device sources ==="
              test -d device/xiaomi/flame
              test -d device/xiaomi/flame-kernel
              test -d vendor/xiaomi/flame

              echo "Device tree: OK"
              echo "Kernel tree: OK"
              echo "Vendor tree: OK"

              echo "=== Preflight: PixelOS build environment ==="
              source build/envsetup.sh

              echo "=== Checking PixelOS target ==="
              lunch custom_flame-cp2a-userdebug

              echo "=== Starting PixelOS build ==="
              m pixelos

              echo "=== Build finished ==="
            '

      - name: Show Crave build status
        if: always()
        working-directory: /crave-devspaces/PixelOS
        run: |
          echo "Workflow completed with status: ${{ job.status }}"
