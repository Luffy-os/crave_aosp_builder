name: Crave Builder(self-hosted)

on:
  workflow_dispatch:
    inputs:
      BASE_PROJECT:
        description: 'Choose a base project:'
        required: true
        default: 'LineageOS 22.1'
        type: choice
        options:
          - 'LineageOS 20.0'
          - 'LineageOS 21.0'
          - 'LineageOS 22.1'
          - 'ArrowOS 13.1'
          - 'DerpFest 14.0'
          - 'CipherOS 14'
          - 'PixelOS 15'
          - 'RisingOS 15 Revived'
          - 'LineageOS 18.1'
          - 'LineageOS 16.0'
          - 'CyanogenMOD 14.1'
          - 'AOSP'

      BUILD_DIFFERENT_ROM:
        description: "Command to initialize a different 'repo' project:"
        required: false
        default: "echo 'Build Starting!'"

      REMOVALS:
        description: "Folders to be removed before syncing:"
        required: false
        default: ""

      LOCAL_MANIFEST:
        description: "Personal local manifest repository URL or raw XML URL:"
        required: true
        default: 'https://github.com/dthakor1555-png/local_manifests_flame'

      LOCAL_MANIFEST_BRANCH:
        description: "Personal local manifest's branch:"
        required: false
        default: 'main'

      DEVICE_NAME:
        description: "Device's codename:"
        required: true
        default: "flame"

      PRODUCT_NAME:
        description: "Product to build:"
        required: true
        default: "infinity_flame"

      BUILD_COMMAND:
        description: 'Command to be used for compiling:'
        required: true
        default: 'm bacon -j$(nproc --all)'

      BUILD_TYPE:
        description: 'Type of build:'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - 'eng'
          - 'userdebug'
          - 'user'

      CLEAN_BUILD:
        description: 'Build with a clean workspace?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:

  Start-Runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Configure the 'crave' environment
        run: |
          echo "DCDEVSPACE status: ${DCDEVSPACE}"

          if [[ "$DCDEVSPACE" == *1* ]]; then
            echo "No need to set up crave, already running in devspace!"
          else
            mkdir -p "${HOME}/bin"

            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --

            mv "${PWD}/crave" "${HOME}/bin/"
            sudo ln -sf "/home/${USER}/bin/crave" /usr/bin/crave

            envsubst < "${PWD}/crave.conf.sample" >> "${PWD}/crave.conf"
            rm -f "${PWD}/crave.conf.sample"
          fi

        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Run crave devspace
        run: |
          crave ${{ secrets.CRAVE_FLAGS }} devspace -- "echo 'Looking for runner...'

          if [ -f actions-runner/run.sh ]; then
            echo 'Runner found!'
          else
            echo 'Error! Runner not found!'
            exit 1
          fi

          if tmux has-session -t ghactions 2>/dev/null; then
            echo 'Runner is already running'
          else
            tmux kill-session -t ghactions 2>/dev/null || true
            tmux new-session -d -s ghactions
            tmux send-keys -t ghactions './actions-runner/run.sh' Enter
            echo 'Runner started'
          fi"

  prepare:
    name: Prepare for Building
    runs-on: ubuntu-latest

    steps:
      - name: Check-out to repository
        uses: actions/checkout@v4

      - name: Check Credentials
        run: |
          if [[ -z "${{ secrets.CRAVE_TOKEN }}" || -z "${{ secrets.CRAVE_USERNAME }}" ]]; then
            echo "Crave Credentials Not Configured! Exiting..."
            exit 1
          fi

          bash scripts/env-checker.sh

      - name: Set Project variables
        id: proj-variables
        shell: bash
        run: |
          set -e

          BASE_PROJECT="${{ github.event.inputs.BASE_PROJECT }}"
          PRODUCT_NAME="${{ github.event.inputs.PRODUCT_NAME }}"
          BUILD_TYPE="${{ github.event.inputs.BUILD_TYPE }}"
          LOCAL_MANIFEST_INPUT="${{ github.event.inputs.LOCAL_MANIFEST }}"
          LOCAL_MANIFEST_BRANCH="${{ github.event.inputs.LOCAL_MANIFEST_BRANCH }}"

          case "$BASE_PROJECT" in

            "ArrowOS 13.1")
              PROJECTFOLDER="/crave-devspaces/Arrow13"
              PROJECTID="73"
              REPO_INIT="repo init -u https://github.com/ArrowOS/android_manifest.git -b arrow-13.1 --depth=1"
              ;;

            "DerpFest 14.0")
              PROJECTFOLDER="/crave-devspaces/DerpFest14"
              PROJECTID="64"
              REPO_INIT="repo init -u https://github.com/DerpFest-AOSP/manifest.git -b 14 --depth=1"
              ;;

            "LineageOS 21.0")
              PROJECTFOLDER="/crave-devspaces/Lineage21"
              PROJECTID="72"
              REPO_INIT="repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1"
              ;;

            "LineageOS 22.1")
              PROJECTFOLDER="/crave-devspaces/Lineage22"
              PROJECTID="93"
              REPO_INIT="repo init -u https://github.com/accupara/los22.git -b lineage-22.1 --git-lfs --depth=1"
              ;;

            "LineageOS 20.0")
              PROJECTFOLDER="/crave-devspaces/Lineage20"
              PROJECTID="36"
              REPO_INIT="repo init -u https://github.com/accupara/los20.git -b lineage-20.0 --git-lfs --depth=1"
              ;;

            "CipherOS 14")
              PROJECTFOLDER="/crave-devspaces/Cipher14"
              PROJECTID="79"
              REPO_INIT="repo init -u https://github.com/CipherOS/android_manifest.git -b fourteen --git-lfs --depth=1"
              ;;

            "PixelOS 15")
              PROJECTFOLDER="/crave-devspaces/Pixel15"
              PROJECTID="82"
              REPO_INIT="repo init -u https://github.com/PixelOS-AOSP/manifest.git -b fifteen --git-lfs --depth=1"
              ;;

            "RisingOS 15 Revived")
              PROJECTFOLDER="/crave-devspaces/Rising15"
              PROJECTID="86"
              REPO_INIT="repo init -u https://github.com/RisingOS-Revived/android.git -b fifteen --git-lfs --depth=1"
              ;;

            "LineageOS 18.1")
              PROJECTFOLDER="/crave-devspaces/Lineage18"
              PROJECTID="85"
              REPO_INIT="repo init -u https://github.com/accupara/los18.1.git -b lineage-18.1 --git-lfs --depth=1"
              ;;

            "LineageOS 16.0")
              PROJECTFOLDER="/crave-devspaces/Lineage16"
              PROJECTID="81"
              REPO_INIT="repo init -u https://github.com/accupara/los16.git -b lineage-16.0 --git-lfs --depth=1"
              ;;

            "CyanogenMOD 14.1")
              PROJECTFOLDER="/crave-devspaces/Cyanogen14"
              PROJECTID="83"
              REPO_INIT="repo init -u https://github.com/accupara/los-cm14.1.git -b cm-14.1 --git-lfs --depth=1"
              ;;

            "AOSP")
              PROJECTFOLDER="/crave-devspaces/AOSP"
              PROJECTID="35"
              REPO_INIT="repo init -u https://android.googlesource.com/platform/manifest.git -b master --git-lfs --depth=1"
              ;;

            *)
              echo "Unknown BASE_PROJECT: $BASE_PROJECT"
              exit 1
              ;;
          esac

          # Infinity-X product target.
          LUNCH="lunch ${PRODUCT_NAME}-${BUILD_TYPE}"

          # Accept:
          # 1. A repository URL
          # 2. A complete git clone command
          # 3. A raw XML URL
          #
          # This prevents:
          # git clone git clone https://...
          #
          if [[ "$LOCAL_MANIFEST_INPUT" =~ ^git[[:space:]]+clone[[:space:]] ]]; then
            LOCAL_MANIFEST="$LOCAL_MANIFEST_INPUT"

          elif [[ "$LOCAL_MANIFEST_INPUT" =~ \.xml/?$ ]]; then
            LOCAL_MANIFEST_URL="${LOCAL_MANIFEST_INPUT%/}"

            LOCAL_MANIFEST="mkdir -p .repo/local_manifests && rm -rf .repo/local_manifests/* && curl -L -o .repo/local_manifests/local_manifest.xml \"$LOCAL_MANIFEST_URL\""

          else
            LOCAL_MANIFEST="git clone --depth=1 -b \"$LOCAL_MANIFEST_BRANCH\" \"$LOCAL_MANIFEST_INPUT\" .repo/local_manifests"
          fi

          echo "========================================"
          echo "Base Project : $BASE_PROJECT"
          echo "Project ID   : $PROJECTID"
          echo "Project Path : $PROJECTFOLDER"
          echo "Product      : $PRODUCT_NAME"
          echo "Build Type   : $BUILD_TYPE"
          echo "Lunch        : $LUNCH"
          echo "Manifest     : $LOCAL_MANIFEST_INPUT"
          echo "Manifest Br. : $LOCAL_MANIFEST_BRANCH"
          echo "========================================"

          echo "PROJECTFOLDER=$PROJECTFOLDER" >> "$GITHUB_OUTPUT"
          echo "PROJECTID=$PROJECTID" >> "$GITHUB_OUTPUT"
          echo "REPO_INIT=$REPO_INIT" >> "$GITHUB_OUTPUT"
          echo "LUNCH=$LUNCH" >> "$GITHUB_OUTPUT"
          echo "LOCAL_MANIFEST=$LOCAL_MANIFEST" >> "$GITHUB_OUTPUT"

          echo "LUNCH=$LUNCH" >> "$GITHUB_ENV"
          echo "LOCAL_MANIFEST=$LOCAL_MANIFEST" >> "$GITHUB_ENV"

      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"

          echo "Base Project: ${{ github.event.inputs.BASE_PROJECT }}"
          echo "Extra Repo Init: ${{ github.event.inputs.BUILD_DIFFERENT_ROM }}"
          echo "Removals: ${{ github.event.inputs.REMOVALS }}"
          echo "Local Manifest: ${{ github.event.inputs.LOCAL_MANIFEST }}"
          echo "Local Manifest Branch: ${{ github.event.inputs.LOCAL_MANIFEST_BRANCH }}"
          echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Product Name: ${{ github.event.inputs.PRODUCT_NAME }}"
          echo "Breakfast/Lunch Target: ${{ env.LUNCH }}"
          echo "Build Command: ${{ github.event.inputs.BUILD_COMMAND }}"
          echo "Clean Build: ${{ github.event.inputs.CLEAN_BUILD }}"

          echo "::endgroup::"

          echo "Local manifest configuration prepared."
          echo "The manifest will be cloned during the actual build."

    outputs:
      PROJECTFOLDER: ${{ steps.proj-variables.outputs.PROJECTFOLDER }}
      PROJECTID: ${{ steps.proj-variables.outputs.PROJECTID }}
      REPO_INIT: ${{ steps.proj-variables.outputs.REPO_INIT }}
      LUNCH: ${{ steps.proj-variables.outputs.LUNCH }}
      LOCAL_MANIFEST: ${{ steps.proj-variables.outputs.LOCAL_MANIFEST }}

  test:
    name: Test Local Manifests
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Set Repo Project
        run: |
          PROJECTFOLDER="${{ needs.prepare.outputs.PROJECTFOLDER }}"
          PROJECTID="${{ needs.prepare.outputs.PROJECTID }}"
          REPO_INIT="${{ needs.prepare.outputs.REPO_INIT }}"
          LUNCH="${{ needs.prepare.outputs.LUNCH }}"
          LOCAL_MANIFEST="${{ needs.prepare.outputs.LOCAL_MANIFEST }}"

          echo "PROJECTFOLDER=$PROJECTFOLDER" >> "$GITHUB_ENV"
          echo "PROJECTID=$PROJECTID" >> "$GITHUB_ENV"
          echo "REPO_INIT=$REPO_INIT" >> "$GITHUB_ENV"
          echo "LUNCH=$LUNCH" >> "$GITHUB_ENV"
          echo "LOCAL_MANIFEST=$LOCAL_MANIFEST" >> "$GITHUB_ENV"

      - name: Configure the 'repo' environment
        run: |
          if ! command -v repo >/dev/null 2>&1; then
            echo "Repo not found. Installing now..."

            mkdir -p ~/bin

            curl -L https://storage.googleapis.com/git-repo-downloads/repo \
              -o ~/bin/repo

            chmod a+x ~/bin/repo

            sudo ln -sf "/home/$(whoami)/bin/repo" /usr/bin/repo

            echo "Repo installation complete."
          else
            echo "Repo already installed."
          fi

      - name: Set-up 'git' credential(s)
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Test Local Manifests
        if: ${{ github.event.inputs.BUILD_DIFFERENT_ROM != 'skip' }}
        shell: bash
        run: |
          set -e

          rm -rf tester
          mkdir -p tester
          cd tester

          if [ "${{ github.event.inputs.BUILD_DIFFERENT_ROM }}" = "echo 'Build Starting!'" ]; then
            $REPO_INIT
          else
            ${{ github.event.inputs.BUILD_DIFFERENT_ROM }}
          fi

          bash -c "$LOCAL_MANIFEST"

          timeout 1m repo sync --force-sync || {
            exit_code=$?

            if [ "$exit_code" -ne 124 ]; then
              echo "Error: Process failed with exit code $exit_code"
              exit "$exit_code"
            fi

            echo "Repo sync timed out after 1 minute."
          }

          du -csh .

          rm -rf .repo

        timeout-minutes: 10

    outputs:
      PROJECTFOLDER: ${{ needs.prepare.outputs.PROJECTFOLDER }}
      PROJECTID: ${{ needs.prepare.outputs.PROJECTID }}
      REPO_INIT: ${{ needs.prepare.outputs.REPO_INIT }}
      LUNCH: ${{ needs.prepare.outputs.LUNCH }}
      LOCAL_MANIFEST: ${{ needs.prepare.outputs.LOCAL_MANIFEST }}

  build:
    name: Build using foss.crave.io
    timeout-minutes: 1440
    needs: test
    runs-on: self-hosted

    concurrency:
      group: ${{ github.repository_owner }}

    steps:

      - name: Set Repo Project
        run: |
          PROJECTFOLDER="${{ needs.test.outputs.PROJECTFOLDER }}"
          PROJECTID="${{ needs.test.outputs.PROJECTID }}"
          REPO_INIT="${{ needs.test.outputs.REPO_INIT }}"
          LUNCH="${{ needs.test.outputs.LUNCH }}"
          LOCAL_MANIFEST="${{ needs.test.outputs.LOCAL_MANIFEST }}"

          echo "PROJECTFOLDER=$PROJECTFOLDER" >> "$GITHUB_ENV"
          echo "PROJECTID=$PROJECTID" >> "$GITHUB_ENV"
          echo "REPO_INIT=$REPO_INIT" >> "$GITHUB_ENV"
          echo "LUNCH=$LUNCH" >> "$GITHUB_ENV"
          echo "LOCAL_MANIFEST=$LOCAL_MANIFEST" >> "$GITHUB_ENV"

      - name: Telegram Notification
        continue-on-error: true
        run: |
          send_telegram_message() {
            local message="$1"

            curl -s -X POST \
              "https://api.telegram.org/bot$botToken/sendMessage" \
              -d chat_id="$chatId" \
              -d text="$message" \
              -d parse_mode="Markdown"
          }

          send_telegram_message "Crave Project: ${{ github.event.inputs.BASE_PROJECT }}%0ACrave ProjectID: $PROJECTID%0ABuild for ${{ github.event.inputs.DEVICE_NAME }} has been queued%0ACheck Progress at:%0Ahttps://github.com/$(echo "${{ github.repository }}" | sed 's@_@\\_@g')/actions/runs/${{ github.run_id }}"

        env:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: "Build Started"
          skipSuccess: false

      - name: Cleanup
        run: |
          rm -rf *

      - name: Check for a broken .bashrc
        continue-on-error: true
        run: |
          (
            set +e

            output=$(source ~/.bashrc 2>&1)
            status=$?

            echo "$output"

            if [[ $status -ne 0 ]]; then
              echo "You have a broken .bashrc, please contact a Crave.io Administrator"
              exit 1
            fi

            if echo "$output" | grep -q "cannot execute"; then
              echo "You have a broken .bashrc, please contact a Crave.io Administrator"
              exit 1
            fi
          )

      - name: Create Project Folders
        shell: bash
        run: |
          set -e

          echo "DCDEVSPACE status: ${DCDEVSPACE}"

          if [[ "$DCDEVSPACE" != *1* ]]; then
            echo "Symlinking devspace folder"

            mkdir -p devspace

            sudo mkdir -p /crave-devspaces

            sudo ln -sfn "${PWD}/devspace" /crave-devspaces

            sudo chmod 777 /crave-devspaces
          else
            echo "Already running in devspace. Skipping symlink setup."
          fi

          if [[ "$DCDEVSPACE" == *1* ]]; then
            echo "Checking for registered Crave clone..."

            if crave clone list --json |
              jq -e '.clones[] | select(."Cloned At"=="'"$PROJECTFOLDER"'")' >/dev/null 2>&1
            then
              echo "Crave clone already exists:"
              echo "$PROJECTFOLDER"
            else
              echo "Crave clone does not exist."
              echo "Creating:"
              echo "$PROJECTFOLDER"

              crave clone create \
                --projectID "$PROJECTID" \
                "$PROJECTFOLDER"
            fi
          else
            mkdir -p "$PROJECTFOLDER"
          fi

      - name: Check-out to repository
        uses: actions/checkout@v4

      - name: Set-up workspace environment
        run: |
          cd "$PROJECTFOLDER"
          mkdir -p "${{ github.event.inputs.DEVICE_NAME }}"

      - name: Set-up 'git' credential(s)
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Configure the 'crave' environment
        run: |
          echo "DCDEVSPACE status: ${DCDEVSPACE}"

          mkdir -p "$PROJECTFOLDER/.repo/manifests"

          if [[ "$DCDEVSPACE" == *1* ]]; then
            echo "No need to set up crave; already running in devspace!"
          else
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --

            mv "${PWD}/crave" "${HOME}/bin/"

            sudo ln -sf "/home/${USER}/bin/crave" /usr/bin/crave

            envsubst < "${PWD}/crave.conf.sample" >> "${PWD}/crave.conf"

            rm -f "${PWD}/crave.conf.sample"

            cp "${PWD}/crave.conf" "$PROJECTFOLDER/"
          fi

          if [[ -z "${{ secrets.CUSTOM_YAML }}" ]]; then
            cp configs/crave/crave.yaml.aosp \
              "$PROJECTFOLDER/.repo/manifests/crave.yaml"

            echo "No Custom Configuration Found, Using Template!"
          else
            printf '%s\n' "${{ secrets.CUSTOM_YAML }}" \
              > "$PROJECTFOLDER/.repo/manifests/crave.yaml"

            echo "Custom Configuration Found!"
          fi

        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Set the 'crave' project
        shell: bash
        run: |
          cd "$PROJECTFOLDER"

          if crave clone list --json |
            jq -e '.clones[] | select(."Cloned At"=="'"$PROJECTFOLDER"'")' >/dev/null 2>&1
          then
            echo "Using registered Crave clone:"
            echo "$PROJECTFOLDER"
          else
            echo "Crave clone not found."
            echo "Initializing base project..."

            $REPO_INIT
          fi

          if [ "${{ github.event.inputs.BUILD_DIFFERENT_ROM }}" = "echo 'Build Starting!'" ]; then
            BUILD_DIFFERENT_ROM="$REPO_INIT"
          else
            BUILD_DIFFERENT_ROM="${{ github.event.inputs.BUILD_DIFFERENT_ROM }}"
          fi

          echo "BUILD_DIFFERENT_ROM=$BUILD_DIFFERENT_ROM" >> "$GITHUB_ENV"

          echo "We will be building with:"
          echo "$LUNCH"

      - name: Start compilation through 'crave'
        if: ${{ github.event.inputs.BUILD_DIFFERENT_ROM != 'skip' }}
        shell: bash
        run: |
          set -e

          cd "$PROJECTFOLDER"

          if [ "${{ github.event.inputs.CLEAN_BUILD }}" = "yes" ]; then
            CLEAN="--clean"
          else
            CLEAN=""
          fi

          if [[ -n "${{ secrets.PAID }}" ]]; then
            echo "Paid Build... Tokens will be consumed."
            PAID="--platform aosp-silver"
          else
            PAID=""
          fi

          REMOVALS="${{ github.event.inputs.REMOVALS }}"

          echo "========================================"
          echo "Starting Crave build"
          echo "Project ID : $PROJECTID"
          echo "Project    : $PROJECTFOLDER"
          echo "Lunch      : $LUNCH"
          echo "========================================"

          crave run \
            --projectID "$PROJECTID" \
            --no-patch \
            $PAID \
            $CLEAN \
            -- \
            "rm -rf .repo/local_manifests/ ${REMOVALS} && \
            ${BUILD_DIFFERENT_ROM} && \
            ${LOCAL_MANIFEST} && \
            if [ -f /usr/bin/resync ]; then \
              /usr/bin/resync; \
            else \
              /opt/crave/resync.sh; \
            fi && \
            export BUILD_USERNAME='${{ github.actor }}' && \
            export BUILD_HOSTNAME=crave && \
            source build/envsetup.sh && \
            echo 'Repository: ${{ github.repository }}' && \
            echo 'Run ID: ${{ github.run_id }}' && \
            ${LUNCH} && \
            make installclean && \
            ${{ github.event.inputs.BUILD_COMMAND }}"

        timeout-minutes: 1440

      - name: Telegram Notification
        if: ${{ success() }}
        continue-on-error: true
        run: |
          send_telegram_message() {
            local message="$1"

            curl -s -X POST \
              "https://api.telegram.org/bot$botToken/sendMessage" \
              -d chat_id="$chatId" \
              -d text="$message" \
              -d parse_mode="Markdown"
          }

          send_telegram_message "Crave Project: ${{ github.event.inputs.BASE_PROJECT }}%0ACrave ProjectID: $PROJECTID%0ABuild for ${{ github.event.inputs.DEVICE_NAME }} has Succeeded!%0ACheck Progress at:%0Ahttps://github.com/$(echo "${{ github.repository }}" | sed 's@_@\\_@g')/actions/runs/${{ github.run_id }}"

        env:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: ${{ job.status }}
          skipSuccess: false

      - name: Telegram Notification
        if: ${{ cancelled() || failure() }}
        continue-on-error: true
        run: |
          send_telegram_message() {
            local message="$1"

            curl -s -X POST \
              "https://api.telegram.org/bot$botToken/sendMessage" \
              -d chat_id="$chatId" \
              -d text="$message" \
              -d parse_mode="Markdown"
          }

          if [ "$jobStatus" = "cancelled" ]; then
            jobMessage="has been Cancelled!"
          else
            jobMessage="has Failed!"
          fi

          send_telegram_message "Crave Project: ${{ github.event.inputs.BASE_PROJECT }}%0ACrave ProjectID: $PROJECTID%0ABuild for ${{ github.event.inputs.DEVICE_NAME }} $jobMessage%0ACheck Progress at:%0Ahttps://github.com/$(echo "${{ github.repository }}" | sed 's@_@\\_@g')/actions/runs/${{ github.run_id }}"

        env:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
          jobStatus: ${{ job.status }}

      - name: Execute if the job is cancelled
        if: ${{ cancelled() }}
        run: |
          cd "$PROJECTFOLDER"
          crave stop --all

      - name: Upload build artifact(s)
        continue-on-error: true
        run: |
          cd "$PROJECTFOLDER"

          echo "${{ secrets.GITHUB_TOKEN }}" > token.txt

          crave push token.txt \
            -d "$(crave ssh -- pwd | grep -v Select | sed -s 's/\r//g')/"

          crave ssh -- \
            "export GH_UPLOAD_LIMIT='${{ secrets.GH_UPLOAD_LIMIT }}'; \
            bash /opt/crave/github-actions/upload.sh \
            '${{ github.run_id }}' \
            '${{ github.event.inputs.DEVICE_NAME }}' \
            '${{ github.repository }}' \
            '${{ github.event.inputs.PRODUCT_NAME }}-${{ github.run_id }}' \
            '${{ secrets.EXTRA_FILES }}'"

      - name: Display error.log
        if: ${{ failure() }}
        id: errorlog
        run: |
          cd "$PROJECTFOLDER"

          crave ssh -- sleep 1

          crave pull out/error.log

          echo "Displaying out/error.log"

          cat out/error.log

      - name: Upload Using telegram-upload
        run: |
          cd "$PROJECTFOLDER"

          crave ssh -- \
            "export TG_UPLOAD_LIMIT='${{ secrets.TG_UPLOAD_LIMIT }}'; \
            bash /opt/crave/telegram/upload.sh \
            '${{ github.event.inputs.DEVICE_NAME }}' \
            '${{ secrets.EXTRA_FILES }}'"

        continue-on-error: true
