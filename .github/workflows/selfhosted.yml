name: PixelOS Android 17 - Flame

on:
  workflow_dispatch:

concurrency:
  group: pixelos-flame
  cancel-in-progress: false

jobs:
  build:
    name: Build PixelOS Android 17
    runs-on: self-hosted
    timeout-minutes: 1440

    env:
      PROJECT_ID: "99"
      PROJECTFOLDER: "/crave-devspaces/Lineage23"

    steps:

      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Check Crave
        run: |
          set -e

          echo "========================================"
          echo "             CRAVE STATUS"
          echo "========================================"

          crave clone list

          echo ""
          echo "Project ID : $PROJECT_ID"
          echo "Workspace  : $PROJECTFOLDER"

      - name: Build PixelOS Android 17
        run: |
          set -e

          echo "========================================"
          echo "       STARTING CRAVE BUILD"
          echo "========================================"

          cd "$PROJECTFOLDER"

          crave run --no-patch -- "
            set -e

            echo '========================================'
            echo '     PIXEL OS ANDROID 17 - FLAME'
            echo '========================================'

            echo ''
            echo '1. Initialize PixelOS Android 17'

            repo init \
              -u https://github.com/PixelOS-AOSP/android_manifest \
              -b seventeen \
              --git-lfs \
              --depth=1

            echo ''
            echo '2. Remove previous LOCAL manifests only'

            rm -rf .repo/local_manifests

            echo ''
            echo '3. Clone EXACT AsTechpro20 manifest'

            git clone \
              --depth=1 \
              -b latest \
              https://github.com/AsTechpro20/local_manifests_flame.git \
              .repo/local_manifests

            echo ''
            echo '========================================'
            echo '     VERIFYING ASTECHPRO20 MANIFEST'
            echo '========================================'

            git -C .repo/local_manifests remote -v

            echo ''
            echo 'Branch:'
            git -C .repo/local_manifests branch --show-current

            echo ''
            echo 'Manifest files:'
            ls -la .repo/local_manifests

            echo ''
            echo 'local_manifests.xml:'
            cat .repo/local_manifests/local_manifests.xml

            echo ''
            echo '========================================'
            echo '     CHECKING DUPLICATE WLAN'
            echo '========================================'

            WLAN_COUNT=$(
              grep -Rho 'path="hardware/qcom/wlan"' \
              .repo/local_manifests 2>/dev/null | wc -l
            )

            echo "Local manifest WLAN entries: $WLAN_COUNT"

            if [ "$WLAN_COUNT" -ne 0 ]; then
              echo "ERROR: AsTechpro20 manifest contains hardware/qcom/wlan."
              exit 1
            fi

            echo "OK: no hardware/qcom/wlan in local manifest."

            echo ''
            echo '========================================'
            echo '     RESYNCING CRAVE WORKSPACE'
            echo '========================================'

            /opt/crave/resync.sh

            echo ''
            echo '========================================'
            echo '     BUILD ENVIRONMENT'
            echo '========================================'

            . build/envsetup.sh

            echo ''
            echo '========================================'
            echo '     LUNCH'
            echo '========================================'

            lunch lineage_flame-bp4a-userdebug

            echo ''
            echo '========================================'
            echo '     INSTALL CLEAN'
            echo '========================================'

            make installclean

            echo ''
            echo '========================================'
            echo '     BUILDING PIXEL OS'
            echo '========================================'

            m bacon

            echo ''
            echo '========================================'
            echo '     PIXEL OS BUILD COMPLETE'
            echo '========================================'
          "

      - name: Build Result
        if: always()
        run: |
          echo "========================================"
          echo "             BUILD RESULT"
          echo "========================================"
          echo "ROM       : PixelOS Android 17"
          echo "Device    : flame"
          echo "Project   : 99"
          echo "Workspace : /crave-devspaces/Lineage23"
          echo "Manifest  : AsTechpro20/local_manifests_flame"
          echo "Branch    : latest"
          echo "========================================"
