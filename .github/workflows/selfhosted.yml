name: Evolution X Builder (self-hosted)

on:
  workflow_dispatch:
    inputs:

      EVOLUTION_BRANCH:
        description: "Evolution X branch"
        required: true
        default: "bka"
        type: choice
        options:
          - "bka"

      CRAVE_PROJECT_ID:
        description: "Crave project ID"
        required: true
        default: "93"

      LOCAL_MANIFEST:
        description: "Local manifest repository URL"
        required: true
        default: "https://github.com/Luffy-os/local_manifests_flame"

      LOCAL_MANIFEST_BRANCH:
        description: "Local manifest branch"
        required: true
        default: "main"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "flame"

      PRODUCT_NAME:
        description: "Product name"
        required: true
        default: "lineage_flame"

      BUILD_COMMAND:
        description: "Build command"
        required: true
        default: "m evolution"

      BUILD_TYPE:
        description: "Build type"
        required: true
        default: "userdebug"
        type: choice
        options:
          - "userdebug"
          - "eng"
          - "user"

      CLEAN_BUILD:
        description: "Clean build?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

      REMOVALS:
        description: "Folders to remove before build"
        required: false
        default: ""


jobs:

  Start-Runner:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq

      - name: Configure Crave
        run: |
          echo "DCDEVSPACE status: ${DCDEVSPACE}"

          if [[ "$DCDEVSPACE" == *1* ]]; then
            echo "Already running inside Crave devspace."
          else
            mkdir -p "${HOME}/bin"

            curl -s \
              https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh \
              | bash -s --

            mv "${PWD}/crave" "${HOME}/bin/"

            sudo ln -sf \
              "/home/${USER}/bin/crave" \
              /usr/bin/crave

            envsubst < "${PWD}/crave.conf.sample" >> "${PWD}/crave.conf"

            rm -f "${PWD}/crave.conf.sample"
          fi

        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Run Crave devspace
        run: |
          crave ${{ secrets.CRAVE_FLAGS }} devspace -- "
          echo 'Looking for runner...'

          if [ -f actions-runner/run.sh ]; then
            echo 'Runner found!'
          else
            echo 'Runner not found!'
            exit 1
          fi

          if tmux has-session -t ghactions 2>/dev/null; then
            echo 'Runner already running'
          else
            tmux kill-session -t ghactions 2>/dev/null || true
            tmux new-session -d -s ghactions
            tmux send-keys -t ghactions './actions-runner/run.sh' Enter
            echo 'Runner started'
          fi
          "


  prepare:

    name: Prepare Evolution X

    runs-on: ubuntu-latest

    outputs:
      PROJECTFOLDER: ${{ steps.variables.outputs.PROJECTFOLDER }}
      PROJECTID: ${{ steps.variables.outputs.PROJECTID }}
      BUILD_DIFFERENT_ROM: ${{ steps.variables.outputs.BUILD_DIFFERENT_ROM }}
      LUNCH: ${{ steps.variables.outputs.LUNCH }}
      LOCAL_MANIFEST: ${{ steps.variables.outputs.LOCAL_MANIFEST }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check credentials
        run: |
          if [[ -z "${{ secrets.CRAVE_TOKEN }}" || -z "${{ secrets.CRAVE_USERNAME }}" ]]; then
            echo "Crave credentials are not configured!"
            exit 1
          fi

          bash scripts/env-checker.sh

      - name: Set project variables
        id: variables
        shell: bash
        run: |
          set -e

          BRANCH="${{ github.event.inputs.EVOLUTION_BRANCH }}"
          PROJECTID="${{ github.event.inputs.CRAVE_PROJECT_ID }}"
          PRODUCT="${{ github.event.inputs.PRODUCT_NAME }}"
          BUILD_TYPE="${{ github.event.inputs.BUILD_TYPE }}"
          MANIFEST="${{ github.event.inputs.LOCAL_MANIFEST }}"
          MANIFEST_BRANCH="${{ github.event.inputs.LOCAL_MANIFEST_BRANCH }}"

          # IMPORTANT:
          # Project 93 is the existing LineageOS 22.1 Crave project.
          PROJECTFOLDER="/crave-devspaces/Lineage22"

          # DO NOT run this repo init in the local Crave clone.
          # It must happen INSIDE `crave run`.
          BUILD_DIFFERENT_ROM="repo init -u https://github.com/Evolution-X/manifest -b ${BRANCH} --git-lfs"

          # Evolution X bka target.
          LUNCH="lunch ${PRODUCT}-bp4a-${BUILD_TYPE}"

          if [[ "$MANIFEST" =~ \.xml/?$ ]]; then

            LOCAL_MANIFEST_URL="${MANIFEST%/}"

            LOCAL_MANIFEST="mkdir -p .repo/local_manifests && rm -rf .repo/local_manifests/* || true && curl -L -o .repo/local_manifests/local_manifest.xml ${LOCAL_MANIFEST_URL}"

          else

            LOCAL_MANIFEST="git clone --depth=1 -b ${MANIFEST_BRANCH} ${MANIFEST} .repo/local_manifests"

          fi

          echo "========================================"
          echo "Evolution X Build Configuration"
          echo "========================================"
          echo "Crave Project : ${PROJECTID}"
          echo "Crave Path    : ${PROJECTFOLDER}"
          echo "ROM Branch    : ${BRANCH}"
          echo "Device        : ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Product       : ${PRODUCT}"
          echo "Build Type    : ${BUILD_TYPE}"
          echo "Lunch         : ${LUNCH}"
          echo "Build Command : ${{ github.event.inputs.BUILD_COMMAND }}"
          echo "========================================"

          echo "PROJECTFOLDER=${PROJECTFOLDER}" >> "$GITHUB_OUTPUT"
          echo "PROJECTID=${PROJECTID}" >> "$GITHUB_OUTPUT"
          echo "BUILD_DIFFERENT_ROM=${BUILD_DIFFERENT_ROM}" >> "$GITHUB_OUTPUT"
          echo "LUNCH=${LUNCH}" >> "$GITHUB_OUTPUT"
          echo "LOCAL_MANIFEST=${LOCAL_MANIFEST}" >> "$GITHUB_OUTPUT"


  test:

    name: Test Evolution X Manifest

    needs: prepare

    runs-on: ubuntu-latest

    outputs:
      PROJECTFOLDER: ${{ needs.prepare.outputs.PROJECTFOLDER }}
      PROJECTID: ${{ needs.prepare.outputs.PROJECTID }}
      BUILD_DIFFERENT_ROM: ${{ needs.prepare.outputs.BUILD_DIFFERENT_ROM }}
      LUNCH: ${{ needs.prepare.outputs.LUNCH }}
      LOCAL_MANIFEST: ${{ needs.prepare.outputs.LOCAL_MANIFEST }}

    steps:

      - name: Set variables
        run: |
          echo "PROJECTFOLDER=${{ needs.prepare.outputs.PROJECTFOLDER }}" >> "$GITHUB_ENV"
          echo "PROJECTID=${{ needs.prepare.outputs.PROJECTID }}" >> "$GITHUB_ENV"
          echo "BUILD_DIFFERENT_ROM=${{ needs.prepare.outputs.BUILD_DIFFERENT_ROM }}" >> "$GITHUB_ENV"
          echo "LUNCH=${{ needs.prepare.outputs.LUNCH }}" >> "$GITHUB_ENV"
          echo "LOCAL_MANIFEST=${{ needs.prepare.outputs.LOCAL_MANIFEST }}" >> "$GITHUB_ENV"

      - name: Install repo
        run: |
          if ! command -v repo >/dev/null 2>&1; then

            mkdir -p ~/bin

            curl -L \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o ~/bin/repo

            chmod a+x ~/bin/repo

            sudo ln -sf \
              "/home/$(whoami)/bin/repo" \
              /usr/bin/repo

          fi

      - name: Configure git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Test local manifest
        shell: bash
        run: |
          set -e

          rm -rf tester

          mkdir -p tester

          cd tester

          echo "========================================"
          echo "Initializing Evolution X"
          echo "========================================"

          $BUILD_DIFFERENT_ROM

          echo "========================================"
          echo "Installing flame local manifest"
          echo "========================================"

          bash -c "$LOCAL_MANIFEST"

          echo "========================================"
          echo "Testing manifest sync"
          echo "========================================"

          timeout 1m repo sync \
            --force-sync || {

              exit_code=$?

              if [ "$exit_code" -ne 124 ]; then
                echo "Manifest test failed!"
                exit "$exit_code"
              fi

              echo "Manifest sync timed out after 1 minute."
              echo "This is expected for a large Android source tree."
          }

          du -csh .

          rm -rf .repo

        timeout-minutes: 10


  build:

    name: Build Evolution X

    timeout-minutes: 1440

    needs: test

    runs-on: self-hosted

    concurrency:
      group: ${{ github.repository_owner }}

    steps:

      - name: Set project variables
        run: |
          echo "PROJECTFOLDER=${{ needs.test.outputs.PROJECTFOLDER }}" >> "$GITHUB_ENV"
          echo "PROJECTID=${{ needs.test.outputs.PROJECTID }}" >> "$GITHUB_ENV"
          echo "BUILD_DIFFERENT_ROM=${{ needs.test.outputs.BUILD_DIFFERENT_ROM }}" >> "$GITHUB_ENV"
          echo "LUNCH=${{ needs.test.outputs.LUNCH }}" >> "$GITHUB_ENV"
          echo "LOCAL_MANIFEST=${{ needs.test.outputs.LOCAL_MANIFEST }}" >> "$GITHUB_ENV"

      - name: Telegram Build Started
        continue-on-error: true
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot$botToken/sendMessage" \
            -d chat_id="$chatId" \
            -d text="Evolution X build started%0ADevice: ${{ github.event.inputs.DEVICE_NAME }}%0ABranch: ${{ github.event.inputs.EVOLUTION_BRANCH }}%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        env:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Cleanup runner workspace
        run: |
          rm -rf *

      - name: Check .bashrc
        continue-on-error: true
        run: |
          (
            set +e

            output=$(source ~/.bashrc 2>&1)

            status=$?

            echo "$output"

            if [[ $status -ne 0 ]]; then
              echo "Broken .bashrc detected."
              exit 1
            fi

            if echo "$output" | grep -q "cannot execute"; then
              echo "Broken .bashrc detected."
              exit 1
            fi
          )

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Configure Crave
        run: |
          echo "DCDEVSPACE status: ${DCDEVSPACE}"

          if [[ "$DCDEVSPACE" == *1* ]]; then
            echo "Already running inside Crave devspace."
          else

            mkdir -p "${HOME}/bin"

            curl -s \
              https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh \
              | bash -s --

            mv "${PWD}/crave" "${HOME}/bin/"

            sudo ln -sf \
              "/home/${USER}/bin/crave" \
              /usr/bin/crave

            envsubst < "${PWD}/crave.conf.sample" >> "${PWD}/crave.conf"

            rm -f "${PWD}/crave.conf.sample"

            cp "${PWD}/crave.conf" "$PROJECTFOLDER/"

          fi

          mkdir -p "$PROJECTFOLDER/.repo/manifests"

          if [[ -z "${{ secrets.CUSTOM_YAML }}" ]]; then

            cp configs/crave/crave.yaml.aosp \
              "$PROJECTFOLDER/.repo/manifests/crave.yaml"

            echo "Using default Crave configuration."

          else

            printf '%s\n' "${{ secrets.CUSTOM_YAML }}" \
              > "$PROJECTFOLDER/.repo/manifests/crave.yaml"

            echo "Using custom Crave configuration."

          fi

        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}


      - name: Verify Crave clone
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking Crave clones"
          echo "========================================"

          crave clone list --json | jq .

          echo "========================================"
          echo "Looking for:"
          echo "$PROJECTFOLDER"
          echo "========================================"

          if crave clone list --json \
            | jq -r '.clones[]."Cloned At"' \
            | grep -Fxq "$PROJECTFOLDER"; then

            echo "Crave clone found!"
            echo "Project ID: $PROJECTID"
            echo "Path: $PROJECTFOLDER"

          else

            echo "Crave clone was not found."

            if [[ "$DCDEVSPACE" == *1* ]]; then

              echo "Creating Crave clone..."

              crave clone create \
                --projectID "$PROJECTID" \
                "$PROJECTFOLDER"

            else

              echo "This runner is not inside a Crave devspace."
              echo "Cannot automatically create the registered clone."
              exit 1

            fi

          fi


      - name: Keep Crave project intact
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Preparing registered Crave project"
          echo "========================================"

          echo "Project:"
          echo "$PROJECTID"

          echo "Path:"
          echo "$PROJECTFOLDER"

          cd "$PROJECTFOLDER"

          echo "Current directory:"
          pwd

          echo ""
          echo "IMPORTANT:"
          echo "The registered LineageOS repo will NOT be re-initialized here."
          echo "Evolution X repo init happens inside crave run."
          echo ""

          echo "Crave clone is ready."


      - name: Start Evolution X build
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Starting Evolution X build"
          echo "========================================"

          echo "Crave Project : $PROJECTID"
          echo "Crave Path    : $PROJECTFOLDER"
          echo "Branch        : ${{ github.event.inputs.EVOLUTION_BRANCH }}"
          echo "Device        : ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Product       : ${{ github.event.inputs.PRODUCT_NAME }}"
          echo "Lunch         : $LUNCH"
          echo "Build command : ${{ github.event.inputs.BUILD_COMMAND }}"
          echo "========================================"

          cd "$PROJECTFOLDER"

          # Remove local project overrides exactly like the
          # upstream self-hosted Crave workflow.
          if [ -f "$HOME/crave.conf" ]; then

            jq '.projects = []' \
              "$HOME/crave.conf" \
              > "$HOME/crave.conf.tmp"

            mv "$HOME/crave.conf.tmp" "$HOME/crave.conf"

            echo "Cleared local Crave project overrides."

          fi

          if [ "${{ github.event.inputs.CLEAN_BUILD }}" = "yes" ]; then
            CLEAN="--clean"
          else
            CLEAN=""
          fi

          if [[ -n "${{ secrets.PAID }}" ]]; then
            PAID="--platform aosp-silver"
          else
            PAID=""
          fi

          echo "========================================"
          echo "Launching Crave"
          echo "========================================"

          # IMPORTANT:
          # Do NOT pass --projectID here.
          #
          # The current directory is the registered Crave clone.
          # Crave identifies the project from that clone.
          #
          # Evolution X repo init happens INSIDE the remote Crave job.

          crave ${{ secrets.CRAVE_FLAGS }} run \
            --no-patch \
            $PAID \
            $CLEAN \
            -- \
            "set -e && \
            echo '========================================' && \
            echo 'Preparing Evolution X bka' && \
            echo '========================================' && \
            rm -rf .repo/local_manifests/ ${{ github.event.inputs.REMOVALS }} && \
            ${BUILD_DIFFERENT_ROM} && \
            echo '========================================' && \
            echo 'Installing flame local manifest' && \
            echo '========================================' && \
            ${LOCAL_MANIFEST} && \
            echo '========================================' && \
            echo 'Synchronizing Evolution X source' && \
            echo '========================================' && \
            if [ -f /usr/bin/resync ]; then \
              /usr/bin/resync; \
            else \
              /opt/crave/resync.sh; \
            fi && \
            echo '========================================' && \
            echo 'Source synchronization complete' && \
            echo '========================================' && \
            export BUILD_USERNAME='${{ github.actor }}' && \
            export BUILD_HOSTNAME=crave && \
            source build/envsetup.sh && \
            echo '========================================' && \
            echo 'Evolution X environment loaded' && \
            echo '========================================' && \
            echo 'Branch: ${{ github.event.inputs.EVOLUTION_BRANCH }}' && \
            echo 'Device: ${{ github.event.inputs.DEVICE_NAME }}' && \
            echo 'Product: ${{ github.event.inputs.PRODUCT_NAME }}' && \
            echo 'Lunch: ${LUNCH}' && \
            echo '========================================' && \
            ${LUNCH} && \
            echo '========================================' && \
            echo 'Lunch successful!' && \
            echo '========================================' && \
            echo 'Running make installclean...' && \
            make installclean && \
            echo '========================================' && \
            echo 'Starting Evolution X build...' && \
            ${{ github.event.inputs.BUILD_COMMAND }}"


      - name: Show build artifacts
        if: always()
        run: |
          echo "========================================"
          echo "Evolution X artifacts"
          echo "========================================"

          OUTPUT_DIR="$PROJECTFOLDER/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"

          echo "Output directory:"
          echo "$OUTPUT_DIR"

          if [ -d "$OUTPUT_DIR" ]; then

            echo "========================================"
            echo "Images and ZIP files"
            echo "========================================"

            find "$OUTPUT_DIR" \
              -maxdepth 3 \
              -type f \
              \( \
                -name "*.zip" \
                -o -name "*.img" \
              \) \
              -print

          else

            echo "Output directory not found."

          fi


      - name: Telegram Build Finished
        if: always()
        continue-on-error: true
        run: |

          if [[ "${{ job.status }}" == "success" ]]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot$botToken/sendMessage" \
            -d chat_id="$chatId" \
            -d text="Evolution X build $STATUS%0ADevice: ${{ github.event.inputs.DEVICE_NAME }}%0ABranch: ${{ github.event.inputs.EVOLUTION_BRANCH }}%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        env:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
