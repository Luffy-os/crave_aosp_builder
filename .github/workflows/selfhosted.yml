name: PixelOS 17 - Redmi 14C 5G

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: self-hosted

    timeout-minutes: 1440

    steps:

      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Set environment
        shell: bash
        run: |
          set -e

          echo "PROJECT_ID=99" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=/crave-devspaces/Lineage23" >> "$GITHUB_ENV"

          echo "PIXEL_BRANCH=seventeen" >> "$GITHUB_ENV"

          echo "DEVICE=flame" >> "$GITHUB_ENV"
          echo "PRODUCT=lineage_flame" >> "$GITHUB_ENV"

          echo "MANIFEST_REPO=https://github.com/Luffy-os/local_manifests_flame" >> "$GITHUB_ENV"
          echo "MANIFEST_BRANCH=main" >> "$GITHUB_ENV"

      - name: Verify Crave
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CRAVE ENVIRONMENT"
          echo "========================================"

          command -v crave
          crave clone list

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: $PROJECT_DIR does not exist."
            exit 1
          fi

          echo "Project: $PROJECT_ID"
          echo "Path: $PROJECT_DIR"

      - name: Configure Crave YAML
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p .repo/manifests

          rm -f .repo/manifests/crave.yaml
          rm -f .repo/manifests/crave.yaml.*

          curl -L \
            -o .repo/manifests/crave.yaml \
            https://raw.githubusercontent.com/sounddrill31/crave_aosp_builder/main/configs/crave/crave.yaml.aosp

          echo "Crave configuration installed."

      - name: Start PixelOS build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "PIXEL OS ANDROID 17"
          echo "========================================"
          echo "Project : $PROJECT_ID"
          echo "Path    : $PROJECT_DIR"
          echo "Branch  : $PIXEL_BRANCH"
          echo "Device  : $DEVICE"
          echo "Product : $PRODUCT"
          echo "========================================"

          crave run \
            --no-patch \
            -- \
            "set -e

            echo '========================================'
            echo 'INITIALIZING PIXEL OS'
            echo '========================================'

            repo init \
              -u https://github.com/PixelOS-AOSP/android_manifest \
              -b seventeen \
              --git-lfs \
              --depth=1

            echo '========================================'
            echo 'INSTALLING FLAME MANIFEST'
            echo '========================================'

            rm -rf .repo/local_manifests

            git clone \
              --depth=1 \
              -b main \
              https://github.com/Luffy-os/local_manifests_flame \
              .repo/local_manifests

            echo '========================================'
            echo 'CLEANING KNOWN STALE GCC REPOSITORIES'
            echo '========================================'

            for repo_path in \
              prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
              prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
              prebuilts/gcc/linux-x86/x86/x86_64-linux-android-4.9
            do
              if [ -d \"\$repo_path\" ]; then
                echo \"Cleaning \$repo_path\"

                git -C \"\$repo_path\" reset --hard HEAD || true
                git -C \"\$repo_path\" clean -fd || true
              fi
            done

            echo '========================================'
            echo 'CRAVE RESYNC'
            echo '========================================'

            /opt/crave/resync.sh

            echo '========================================'
            echo 'SOURCE SYNC COMPLETE'
            echo '========================================'

            source build/envsetup.sh

            echo '========================================'
            echo 'LUNCH'
            echo '========================================'

            lunch lineage_flame-bp4a-userdebug

            echo '========================================'
            echo 'INSTALLCLEAN'
            echo '========================================'

            make installclean

            echo '========================================'
            echo 'BUILDING PIXEL OS'
            echo '========================================'

            m bacon"

      - name: Build finished
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"
          echo "Status: ${{ job.status }}"
          echo "Device: flame"
          echo "ROM: PixelOS Android 17"
          echo "========================================"
