name: PixelOS Android 17 Builder

on:
  workflow_dispatch:
    inputs:

      PIXELOS_BRANCH:
        description: "PixelOS branch"
        required: true
        default: "seventeen"
        type: choice
        options:
          - "seventeen"

      CRAVE_PROJECT_ID:
        description: "Crave project ID"
        required: true
        default: "93"

      LOCAL_MANIFEST:
        description: "Local manifest repository URL"
        required: true
        default: "https://github.com/Luffy-os/local_manifests_flame"

      LOCAL_MANIFEST_BRANCH:
        description: "Local manifest branch"
        required: true
        default: "main"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "flame"

      PRODUCT_NAME:
        description: "Product name"
        required: true
        default: "lineage_flame"

      BUILD_COMMAND:
        description: "Build command"
        required: true
        default: "m bacon"

      BUILD_TYPE:
        description: "Build type"
        required: true
        default: "userdebug"
        type: choice
        options:
          - "userdebug"
          - "eng"
          - "user"

      CLEAN_BUILD:
        description: "Clean build?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

      REMOVALS:
        description: "Folders to remove before build"
        required: false
        default: ""


jobs:

  prepare:

    name: Prepare PixelOS

    runs-on: ubuntu-latest

    outputs:
      PROJECTFOLDER: ${{ steps.variables.outputs.PROJECTFOLDER }}
      PROJECTID: ${{ steps.variables.outputs.PROJECTID }}
      BUILD_DIFFERENT_ROM: ${{ steps.variables.outputs.BUILD_DIFFERENT_ROM }}
      LUNCH: ${{ steps.variables.outputs.LUNCH }}
      LOCAL_MANIFEST: ${{ steps.variables.outputs.LOCAL_MANIFEST }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Check credentials
        run: |
          if [[ -z "${{ secrets.CRAVE_TOKEN }}" || -z "${{ secrets.CRAVE_USERNAME }}" ]]; then
            echo "Crave credentials are not configured!"
            exit 1
          fi

          bash scripts/env-checker.sh


      - name: Set project variables
        id: variables
        shell: bash
        run: |
          set -e

          BRANCH="${{ github.event.inputs.PIXELOS_BRANCH }}"
          PROJECTID="${{ github.event.inputs.CRAVE_PROJECT_ID }}"
          PRODUCT="${{ github.event.inputs.PRODUCT_NAME }}"
          BUILD_TYPE="${{ github.event.inputs.BUILD_TYPE }}"
          MANIFEST="${{ github.event.inputs.LOCAL_MANIFEST }}"
          MANIFEST_BRANCH="${{ github.event.inputs.LOCAL_MANIFEST_BRANCH }}"

          # Registered Crave Project 93
          PROJECTFOLDER="/crave-devspaces/Lineage22"

          # PixelOS repo initialization happens inside crave run.
          BUILD_DIFFERENT_ROM="repo init -u https://github.com/PixelOS-AOSP/android_manifest -b ${BRANCH} --git-lfs"

          # Flame product target
          LUNCH="lunch ${PRODUCT}-bp4a-${BUILD_TYPE}"

          if [[ "$MANIFEST" =~ \.xml/?$ ]]; then

            LOCAL_MANIFEST_URL="${MANIFEST%/}"

            LOCAL_MANIFEST="mkdir -p .repo/local_manifests && rm -rf .repo/local_manifests/* && curl -L -o .repo/local_manifests/local_manifest.xml ${LOCAL_MANIFEST_URL}"

          else

            LOCAL_MANIFEST="git clone --depth=1 -b ${MANIFEST_BRANCH} ${MANIFEST} .repo/local_manifests"

          fi

          echo "========================================"
          echo "PixelOS Android 17 Configuration"
          echo "========================================"
          echo "Crave Project  : ${PROJECTID}"
          echo "Crave Path     : ${PROJECTFOLDER}"
          echo "ROM Branch     : ${BRANCH}"
          echo "Device         : ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Product        : ${PRODUCT}"
          echo "Build Type     : ${BUILD_TYPE}"
          echo "Lunch          : ${LUNCH}"
          echo "Build Command  : ${{ github.event.inputs.BUILD_COMMAND }}"
          echo "Manifest       : ${MANIFEST}"
          echo "Manifest Branch: ${MANIFEST_BRANCH}"
          echo "========================================"

          echo "PROJECTFOLDER=${PROJECTFOLDER}" >> "$GITHUB_OUTPUT"
          echo "PROJECTID=${PROJECTID}" >> "$GITHUB_OUTPUT"
          echo "BUILD_DIFFERENT_ROM=${BUILD_DIFFERENT_ROM}" >> "$GITHUB_OUTPUT"
          echo "LUNCH=${LUNCH}" >> "$GITHUB_OUTPUT"
          echo "LOCAL_MANIFEST=${LOCAL_MANIFEST}" >> "$GITHUB_OUTPUT"


  build:

    name: Build PixelOS Android 17

    runs-on: ubuntu-latest

    timeout-minutes: 1440

    needs: prepare

    concurrency:
      group: ${{ github.repository_owner }}-pixelos


    steps:

      - name: Checkout workflow repository
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl


      - name: Configure git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"


      - name: Telegram Build Started
        continue-on-error: true
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot$botToken/sendMessage" \
            -d chat_id="$chatId" \
            -d text="PixelOS Android 17 build started%0ADevice: ${{ github.event.inputs.DEVICE_NAME }}%0ABranch: ${{ github.event.inputs.PIXELOS_BRANCH }}%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        env:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}


      - name: Install Crave
        shell: bash
        run: |
          set -e

          mkdir -p "${HOME}/bin"

          curl -s \
            https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh \
            | bash -s --

          mv "${PWD}/crave" "${HOME}/bin/"

          sudo ln -sf \
            "${HOME}/bin/crave" \
            /usr/bin/crave

          echo "${HOME}/bin" >> "$GITHUB_PATH"

        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}


      - name: Configure Crave credentials
        shell: bash
        run: |
          set -e

          envsubst < "${PWD}/crave.conf.sample" > "${PWD}/crave.conf"

          echo "Crave configuration generated."


      - name: Configure Crave project
        shell: bash
        run: |
          set -e

          PROJECTFOLDER="${{ needs.prepare.outputs.PROJECTFOLDER }}"

          mkdir -p "$PROJECTFOLDER/.repo/manifests"

          if [[ -z "${{ secrets.CUSTOM_YAML }}" ]]; then

            cp configs/crave/crave.yaml.aosp \
              "$PROJECTFOLDER/.repo/manifests/crave.yaml"

            echo "Using default Crave configuration."

          else

            printf '%s\n' "${{ secrets.CUSTOM_YAML }}" \
              > "$PROJECTFOLDER/.repo/manifests/crave.yaml"

            echo "Using custom Crave configuration."

          fi


      - name: Verify Crave project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Crave project information"
          echo "========================================"

          crave clone list --json | jq .

          echo "========================================"
          echo "Expected project"
          echo "========================================"

          echo "Project ID : ${{ needs.prepare.outputs.PROJECTID }}"
          echo "Path       : ${{ needs.prepare.outputs.PROJECTFOLDER }}"
          echo "========================================"


      - name: Start PixelOS Android 17 build
        shell: bash
        run: |
          set -e

          PROJECTFOLDER="${{ needs.prepare.outputs.PROJECTFOLDER }}"
          PROJECTID="${{ needs.prepare.outputs.PROJECTID }}"
          BUILD_DIFFERENT_ROM="${{ needs.prepare.outputs.BUILD_DIFFERENT_ROM }}"
          LUNCH="${{ needs.prepare.outputs.LUNCH }}"
          LOCAL_MANIFEST="${{ needs.prepare.outputs.LOCAL_MANIFEST }}"

          echo "========================================"
          echo "Starting PixelOS Android 17"
          echo "========================================"

          echo "Crave Project : $PROJECTID"
          echo "Crave Path    : $PROJECTFOLDER"
          echo "PixelOS Branch: ${{ github.event.inputs.PIXELOS_BRANCH }}"
          echo "Device        : ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Product       : ${{ github.event.inputs.PRODUCT_NAME }}"
          echo "Lunch         : $LUNCH"
          echo "Build Command : ${{ github.event.inputs.BUILD_COMMAND }}"
          echo "========================================"

          cd "$PROJECTFOLDER"

          if [[ -f "$HOME/crave.conf" ]]; then

            jq '.projects = []' \
              "$HOME/crave.conf" \
              > "$HOME/crave.conf.tmp"

            mv "$HOME/crave.conf.tmp" "$HOME/crave.conf"

            echo "Cleared local Crave project overrides."

          fi

          if [ "${{ github.event.inputs.CLEAN_BUILD }}" = "yes" ]; then
            CLEAN="--clean"
          else
            CLEAN=""
          fi

          if [[ -n "${{ secrets.PAID }}" ]]; then
            PAID="--platform aosp-silver"
          else
            PAID=""
          fi

          echo "========================================"
          echo "Launching Crave"
          echo "========================================"

          crave ${{ secrets.CRAVE_FLAGS }} run \
            --no-patch \
            $PAID \
            $CLEAN \
            -- \
            "set -e && \
            echo '========================================' && \
            echo 'Initializing PixelOS Android 17' && \
            echo '========================================' && \
            ${BUILD_DIFFERENT_ROM} && \
            echo '========================================' && \
            echo 'Installing Flame local manifest' && \
            echo '========================================' && \
            rm -rf .repo/local_manifests && \
            ${LOCAL_MANIFEST} && \
            echo '========================================' && \
            echo 'Synchronizing PixelOS source' && \
            echo '========================================' && \
            if [ -f /usr/bin/resync ]; then \
              /usr/bin/resync; \
            else \
              /opt/crave/resync.sh; \
            fi && \
            echo '========================================' && \
            echo 'Source synchronization complete' && \
            echo '========================================' && \
            export BUILD_USERNAME='${{ github.actor }}' && \
            export BUILD_HOSTNAME=crave && \
            source build/envsetup.sh && \
            echo '========================================' && \
            echo 'PixelOS environment loaded' && \
            echo '========================================' && \
            echo 'Checking lunch target...' && \
            ${LUNCH} && \
            echo '========================================' && \
            echo 'Lunch successful!' && \
            echo '========================================' && \
            echo 'Running make installclean...' && \
            make installclean && \
            echo '========================================' && \
            echo 'Starting PixelOS Android 17 build...' && \
            ${{ github.event.inputs.BUILD_COMMAND }}"


      - name: Show build artifacts
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "PixelOS Android 17 artifacts"
          echo "========================================"

          PROJECTFOLDER="${{ needs.prepare.outputs.PROJECTFOLDER }}"

          OUTPUT_DIR="$PROJECTFOLDER/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"

          echo "Expected output:"
          echo "$OUTPUT_DIR"

          if [ -d "$OUTPUT_DIR" ]; then

            echo "========================================"
            echo "Images and ZIP files"
            echo "========================================"

            find "$OUTPUT_DIR" \
              -maxdepth 3 \
              -type f \
              \( \
                -name "*.zip" \
                -o -name "*.img" \
              \) \
              -print

          else

            echo "Output directory not found on GitHub runner."
            echo "Build artifacts may exist only on the remote Crave build node."

          fi


      - name: Telegram Build Finished
        if: always()
        continue-on-error: true
        run: |

          if [[ "${{ job.status }}" == "success" ]]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot$botToken/sendMessage" \
            -d chat_id="$chatId" \
            -d text="PixelOS Android 17 build $STATUS%0ADevice: ${{ github.event.inputs.DEVICE_NAME }}%0ABranch: ${{ github.event.inputs.PIXELOS_BRANCH }}%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        env:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
