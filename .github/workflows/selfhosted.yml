name: Evolution X Builder (self-hosted)

on:
  workflow_dispatch:
    inputs:

      EVOLUTION_BRANCH:
        description: "Evolution X branch"
        required: true
        default: "bka"
        type: choice
        options:
          - "bka"

      CRAVE_PROJECT_ID:
        description: "Crave project ID"
        required: true
        default: "93"

      BUILD_DIFFERENT_ROM:
        description: "Evolution X repo initialization"
        required: true
        default: "repo init -u https://github.com/Evolution-X/manifest.git -b bka --git-lfs --depth=1"

      REMOVALS:
        description: "Folders to remove before syncing"
        required: false
        default: ""

      LOCAL_MANIFEST:
        description: "Local manifest repository"
        required: true
        default: "https://github.com/Luffy-os/local_manifests_flame"

      LOCAL_MANIFEST_BRANCH:
        description: "Local manifest branch"
        required: true
        default: "main"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "flame"

      PRODUCT_NAME:
        description: "Product name"
        required: true
        default: "lineage_flame"

      BUILD_COMMAND:
        description: "Evolution X build command"
        required: true
        default: "m evolution"

      BUILD_TYPE:
        description: "Build type"
        required: true
        default: "userdebug"
        type: choice
        options:
          - "userdebug"
          - "eng"
          - "user"

      CLEAN_BUILD:
        description: "Clean build?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"


jobs:

  Start-Runner:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Configure Crave
        run: |

          echo "DCDEVSPACE status: ${DCDEVSPACE}"

          if [[ "$DCDEVSPACE" == *1* ]]; then

            echo "Already running in Crave devspace."

          else

            mkdir -p "${HOME}/bin"

            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --

            mv "${PWD}/crave" "${HOME}/bin/"

            sudo ln -sf "/home/${USER}/bin/crave" /usr/bin/crave

            envsubst < "${PWD}/crave.conf.sample" >> "${PWD}/crave.conf"

            rm -f "${PWD}/crave.conf.sample"

          fi

        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Run Crave devspace
        run: |

          crave ${{ secrets.CRAVE_FLAGS }} devspace -- "
          echo 'Looking for runner...'

          if [ -f actions-runner/run.sh ]; then
            echo 'Runner found!'
          else
            echo 'Runner not found!'
            exit 1
          fi

          if tmux has-session -t ghactions 2>/dev/null; then

            echo 'Runner already running'

          else

            tmux kill-session -t ghactions 2>/dev/null || true

            tmux new-session -d -s ghactions

            tmux send-keys -t ghactions './actions-runner/run.sh' Enter

            echo 'Runner started'

          fi
          "


  prepare:

    name: Prepare Evolution X

    runs-on: ubuntu-latest

    outputs:

      PROJECTFOLDER: ${{ steps.variables.outputs.PROJECTFOLDER }}
      PROJECTID: ${{ steps.variables.outputs.PROJECTID }}
      REPO_INIT: ${{ steps.variables.outputs.REPO_INIT }}
      LUNCH: ${{ steps.variables.outputs.LUNCH }}
      LOCAL_MANIFEST: ${{ steps.variables.outputs.LOCAL_MANIFEST }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check credentials
        run: |

          if [[ -z "${{ secrets.CRAVE_TOKEN }}" || -z "${{ secrets.CRAVE_USERNAME }}" ]]; then

            echo "Crave credentials are not configured!"

            exit 1

          fi

          bash scripts/env-checker.sh

      - name: Set project variables
        id: variables
        shell: bash
        run: |

          set -e

          BRANCH="${{ github.event.inputs.EVOLUTION_BRANCH }}"

          PRODUCT="${{ github.event.inputs.PRODUCT_NAME }}"

          BUILD_TYPE="${{ github.event.inputs.BUILD_TYPE }}"

          MANIFEST="${{ github.event.inputs.LOCAL_MANIFEST }}"

          MANIFEST_BRANCH="${{ github.event.inputs.LOCAL_MANIFEST_BRANCH }}"

          PROJECTID="${{ github.event.inputs.CRAVE_PROJECT_ID }}"

          PROJECTFOLDER="/crave-devspaces/EvolutionX-${BRANCH}"

          REPO_INIT="${{ github.event.inputs.BUILD_DIFFERENT_ROM }}"

          LUNCH="${PRODUCT}-${BUILD_TYPE}"

          if [[ "$MANIFEST" =~ ^git[[:space:]]+clone[[:space:]] ]]; then

            LOCAL_MANIFEST="$MANIFEST"

          elif [[ "$MANIFEST" =~ \.xml/?$ ]]; then

            LOCAL_MANIFEST_URL="${MANIFEST%/}"

            LOCAL_MANIFEST="mkdir -p .repo/local_manifests && rm -rf .repo/local_manifests/* && curl -L -o .repo/local_manifests/local_manifest.xml \"$LOCAL_MANIFEST_URL\""

          else

            LOCAL_MANIFEST="git clone --depth=1 -b \"$MANIFEST_BRANCH\" \"$MANIFEST\" .repo/local_manifests"

          fi

          echo "========================================"

          echo "Base Project : Evolution X"

          echo "Branch       : $BRANCH"

          echo "Crave ID     : $PROJECTID"

          echo "Workspace    : $PROJECTFOLDER"

          echo "Device       : ${{ github.event.inputs.DEVICE_NAME }}"

          echo "Product      : $PRODUCT"

          echo "Build Type   : $BUILD_TYPE"

          echo "Lunch        : $LUNCH"

          echo "Manifest     : $MANIFEST"

          echo "========================================"

          echo "PROJECTFOLDER=$PROJECTFOLDER" >> "$GITHUB_OUTPUT"

          echo "PROJECTID=$PROJECTID" >> "$GITHUB_OUTPUT"

          echo "REPO_INIT=$REPO_INIT" >> "$GITHUB_OUTPUT"

          echo "LUNCH=$LUNCH" >> "$GITHUB_OUTPUT"

          echo "LOCAL_MANIFEST=$LOCAL_MANIFEST" >> "$GITHUB_OUTPUT"


  test:

    name: Test Evolution X Manifest

    needs: prepare

    runs-on: ubuntu-latest

    outputs:

      PROJECTFOLDER: ${{ needs.prepare.outputs.PROJECTFOLDER }}
      PROJECTID: ${{ needs.prepare.outputs.PROJECTID }}
      REPO_INIT: ${{ needs.prepare.outputs.REPO_INIT }}
      LUNCH: ${{ needs.prepare.outputs.LUNCH }}
      LOCAL_MANIFEST: ${{ needs.prepare.outputs.LOCAL_MANIFEST }}

    steps:

      - name: Set variables
        run: |

          echo "PROJECTFOLDER=${{ needs.prepare.outputs.PROJECTFOLDER }}" >> "$GITHUB_ENV"

          echo "PROJECTID=${{ needs.prepare.outputs.PROJECTID }}" >> "$GITHUB_ENV"

          echo "REPO_INIT=${{ needs.prepare.outputs.REPO_INIT }}" >> "$GITHUB_ENV"

          echo "LUNCH=${{ needs.prepare.outputs.LUNCH }}" >> "$GITHUB_ENV"

          echo "LOCAL_MANIFEST=${{ needs.prepare.outputs.LOCAL_MANIFEST }}" >> "$GITHUB_ENV"

      - name: Install repo
        run: |

          if ! command -v repo >/dev/null 2>&1; then

            mkdir -p ~/bin

            curl -L https://storage.googleapis.com/git-repo-downloads/repo \
              -o ~/bin/repo

            chmod a+x ~/bin/repo

            sudo ln -sf "/home/$(whoami)/bin/repo" /usr/bin/repo

          fi

      - name: Configure git
        run: |

          git config --global user.name "${{ github.actor }}"

          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Test manifest
        shell: bash
        run: |

          set -e

          rm -rf tester

          mkdir tester

          cd tester

          $REPO_INIT

          bash -c "$LOCAL_MANIFEST"

          timeout 1m repo sync --force-sync || {

            exit_code=$?

            if [ "$exit_code" -ne 124 ]; then

              echo "Manifest test failed!"

              exit "$exit_code"

            fi

            echo "Manifest test timed out."

          }

          du -csh .

          rm -rf .repo

        timeout-minutes: 10


  build:

    name: Build Evolution X

    timeout-minutes: 1440

    needs: test

    runs-on: self-hosted

    concurrency:

      group: ${{ github.repository_owner }}

    steps:

      - name: Set project variables
        run: |

          echo "PROJECTFOLDER=${{ needs.test.outputs.PROJECTFOLDER }}" >> "$GITHUB_ENV"

          echo "PROJECTID=${{ needs.test.outputs.PROJECTID }}" >> "$GITHUB_ENV"

          echo "REPO_INIT=${{ needs.test.outputs.REPO_INIT }}" >> "$GITHUB_ENV"

          echo "LUNCH=${{ needs.test.outputs.LUNCH }}" >> "$GITHUB_ENV"

          echo "LOCAL_MANIFEST=${{ needs.test.outputs.LOCAL_MANIFEST }}" >> "$GITHUB_ENV"


      - name: Telegram Build Started
        continue-on-error: true
        run: |

          send_telegram_message() {

            local message="$1"

            curl -s -X POST \
              "https://api.telegram.org/bot$botToken/sendMessage" \
              -d chat_id="$chatId" \
              -d text="$message"

          }

          send_telegram_message \
            "Evolution X build started%0ADevice: ${{ github.event.inputs.DEVICE_NAME }}%0ABranch: ${{ github.event.inputs.EVOLUTION_BRANCH }}%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        env:

          chatId: ${{ secrets.TELEGRAM_TO }}

          botToken: ${{ secrets.TELEGRAM_TOKEN }}


      - name: Cleanup runner workspace
        run: |

          rm -rf *


      - name: Check .bashrc
        continue-on-error: true
        run: |

          (
            set +e

            output=$(source ~/.bashrc 2>&1)

            status=$?

            echo "$output"

            if [[ $status -ne 0 ]]; then

              echo "Broken .bashrc detected."

              exit 1

            fi

          )


      - name: Create project folders
        shell: bash
        run: |

          set -e

          echo "DCDEVSPACE status: ${DCDEVSPACE}"

          if [[ "$DCDEVSPACE" != *1* ]]; then

            mkdir -p devspace

            sudo mkdir -p /crave-devspaces

            sudo ln -sfn "${PWD}/devspace" /crave-devspaces

            sudo chmod 777 /crave-devspaces

          fi

          if [[ "$DCDEVSPACE" == *1* ]]; then

            if crave clone list --json |
              jq -e '.clones[] | select(."Cloned At"=="'"$PROJECTFOLDER"'")' >/dev/null 2>&1
            then

              echo "Existing Crave clone found."

            else

              echo "Creating Crave clone..."

              crave clone create \
                --projectID "$PROJECTID" \
                "$PROJECTFOLDER"

            fi

          else

            mkdir -p "$PROJECTFOLDER"

          fi


      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure git
        run: |

          git config --global user.name "${{ github.actor }}"

          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"


      - name: Configure Crave
        run: |

          mkdir -p "$PROJECTFOLDER/.repo/manifests"

          if [[ "$DCDEVSPACE" != *1* ]]; then

            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --

            mv "${PWD}/crave" "${HOME}/bin/"

            sudo ln -sf "/home/${USER}/bin/crave" /usr/bin/crave

            envsubst < "${PWD}/crave.conf.sample" >> "${PWD}/crave.conf"

            rm -f "${PWD}/crave.conf.sample"

            cp "${PWD}/crave.conf" "$PROJECTFOLDER/"

          fi

          if [[ -z "${{ secrets.CUSTOM_YAML }}" ]]; then

            cp configs/crave/crave.yaml.aosp \
              "$PROJECTFOLDER/.repo/manifests/crave.yaml"

            echo "Using default Crave configuration."

          else

            printf '%s\n' "${{ secrets.CUSTOM_YAML }}" \
              > "$PROJECTFOLDER/.repo/manifests/crave.yaml"

            echo "Using custom Crave configuration."

          fi

        env:

          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}

          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}


      - name: Initialize Evolution X source
        shell: bash
        run: |

          cd "$PROJECTFOLDER"

          echo "========================================"

          echo "Initializing Evolution X"

          echo "Branch: ${{ github.event.inputs.EVOLUTION_BRANCH }}"

          echo "========================================"

          if [ ! -d ".repo" ]; then

            $REPO_INIT

          else

            echo "Existing .repo detected."

            $REPO_INIT

          fi


      - name: Start Evolution X build
        shell: bash
        run: |

          set -e

          cd "$PROJECTFOLDER"

          if [ "${{ github.event.inputs.CLEAN_BUILD }}" = "yes" ]; then

            CLEAN="--clean"

          else

            CLEAN=""

          fi

          if [[ -n "${{ secrets.PAID }}" ]]; then

            PAID="--platform aosp-silver"

          else

            PAID=""

          fi

          REMOVALS="${{ github.event.inputs.REMOVALS }}"

          crave run \
            --projectID "$PROJECTID" \
            --no-patch \
            $PAID \
            $CLEAN \
            -- \
            "set -e && \
            cd '$PROJECTFOLDER' && \
            rm -rf .repo/local_manifests/ && \
            ${REPO_INIT} && \
            ${LOCAL_MANIFEST} && \
            if [ -f /usr/bin/resync ]; then \
              /usr/bin/resync; \
            else \
              /opt/crave/resync.sh; \
            fi && \
            export BUILD_USERNAME='${{ github.actor }}' && \
            export BUILD_HOSTNAME=crave && \
            source build/envsetup.sh && \
            echo '========================================' && \
            echo 'Evolution X build environment ready' && \
            echo 'Branch: ${{ github.event.inputs.EVOLUTION_BRANCH }}' && \
            echo 'Device: ${{ github.event.inputs.DEVICE_NAME }}' && \
            echo 'Product: ${{ github.event.inputs.PRODUCT_NAME }}' && \
            echo 'Lunch: ${LUNCH}' && \
            echo '========================================' && \
            ${LUNCH} && \
            echo 'Starting build...' && \
            ${{ github.event.inputs.BUILD_COMMAND }} -j\$(nproc --all)"


      - name: Show build artifacts
        if: always()
        run: |

          cd "$PROJECTFOLDER" || exit 0

          echo "========================================"

          echo "Evolution X artifacts"

          echo "========================================"

          find out/target/product/${{ github.event.inputs.DEVICE_NAME }} \
            -maxdepth 2 \
            -type f \
            \( \
              -name "*.zip" \
              -o -name "*.img" \
            \) \
            -print 2>/dev/null || true


      - name: Telegram Build Finished
        if: always()
        continue-on-error: true
        run: |

          if [[ "${{ job.status }}" == "success" ]]; then

            STATUS="SUCCESS"

          else

            STATUS="FAILED"

          fi

          curl -s -X POST \
            "https://api.telegram.org/bot$botToken/sendMessage" \
            -d chat_id="$chatId" \
            -d text="Evolution X build $STATUS%0ADevice: ${{ github.event.inputs.DEVICE_NAME }}%0ABranch: ${{ github.event.inputs.EVOLUTION_BRANCH }}%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        env:

          chatId: ${{ secrets.TELEGRAM_TO }}

          botToken: ${{ secrets.TELEGRAM_TOKEN }}
