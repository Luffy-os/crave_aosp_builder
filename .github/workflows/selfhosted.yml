name: PixelOS 17 - Redmi 14C 5G

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: self-hosted

    timeout-minutes: 1440

    steps:

      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Set variables
        shell: bash
        run: |
          set -e

          echo "PROJECT_ID=99" >> "$GITHUB_ENV"
          echo "PROJECTFOLDER=/crave-devspaces/Lineage23" >> "$GITHUB_ENV"

          echo "DEVICE_NAME=flame" >> "$GITHUB_ENV"
          echo "PRODUCT_NAME=lineage_flame" >> "$GITHUB_ENV"

          echo "REPO_INIT=repo init -u https://github.com/PixelOS-AOSP/android_manifest -b seventeen --git-lfs --depth=1" >> "$GITHUB_ENV"

          echo "LOCAL_MANIFEST=git clone --depth=1 -b main https://github.com/Luffy-os/local_manifests_flame .repo/local_manifests" >> "$GITHUB_ENV"

          echo "LUNCH=lunch lineage_flame-bp4a-userdebug" >> "$GITHUB_ENV"

          echo "BUILD_COMMAND=m bacon" >> "$GITHUB_ENV"

      - name: Check Crave
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CRAVE"
          echo "========================================"

          command -v crave

          crave clone list

          echo "Project ID: $PROJECT_ID"
          echo "Project folder: $PROJECTFOLDER"

          if ! crave clone list --json | jq -r '.[]."Cloned At"' 2>/dev/null | grep -Fxq "$PROJECTFOLDER"; then
            echo "Clone not found."
            exit 1
          fi

      - name: Configure Crave
        shell: bash
        run: |
          set -e

          cd "$PROJECTFOLDER"

          mkdir -p .repo/manifests

          curl -L \
            -o .repo/manifests/crave.yaml \
            https://raw.githubusercontent.com/sounddrill31/crave_aosp_builder/main/configs/crave/crave.yaml.aosp

          echo "Crave YAML configured."

      - name: Build PixelOS
        shell: bash
        timeout-minutes: 1440
        run: |
          set -e

          cd "$PROJECTFOLDER"

          echo "========================================"
          echo "PIXEL OS ANDROID 17"
          echo "========================================"
          echo "Project : $PROJECT_ID"
          echo "Folder  : $PROJECTFOLDER"
          echo "Device  : $DEVICE_NAME"
          echo "Product : $PRODUCT_NAME"
          echo "Branch  : seventeen"
          echo "========================================"

          crave run \
            --no-patch \
            -- \
            "set -e

            echo '========================================'
            echo 'INITIALIZING PIXEL OS'
            echo '========================================'

            $REPO_INIT

            echo '========================================'
            echo 'INSTALLING DEVICE MANIFEST'
            echo '========================================'

            rm -rf .repo/local_manifests

            $LOCAL_MANIFEST

            echo '========================================'
            echo 'VERIFYING MANIFEST'
            echo '========================================'

            echo 'Device manifest:'
            find .repo/local_manifests -type f -maxdepth 2 -print

            echo '========================================'
            echo 'CRAVE RESYNC'
            echo '========================================'

            /opt/crave/resync.sh

            echo '========================================'
            echo 'SOURCE SYNC COMPLETE'
            echo '========================================'

            source build/envsetup.sh

            echo '========================================'
            echo 'LUNCH'
            echo '========================================'

            $LUNCH

            echo '========================================'
            echo 'INSTALLCLEAN'
            echo '========================================'

            make installclean

            echo '========================================'
            echo 'BUILDING PIXEL OS'
            echo '========================================'

            $BUILD_COMMAND"

      - name: Build result
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"
          echo "Status: ${{ job.status }}"
          echo "Device: flame"
          echo "ROM: PixelOS Android 17"
          echo "========================================"
