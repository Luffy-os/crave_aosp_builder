name: PixelOS Android 17 - Flame

on:
  workflow_dispatch:

concurrency:
  group: pixelos-flame
  cancel-in-progress: false

jobs:
  build:
    name: Build PixelOS Android 17
    runs-on: self-hosted
    timeout-minutes: 1440

    env:
      PROJECT_ID: 99
      PROJECTFOLDER: /crave-devspaces/Lineage23
      DEVICE_NAME: flame
      PRODUCT_NAME: lineage_flame

    steps:

      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Check Crave
        run: |
          set -e

          echo "======================================"
          echo "          CRAVE STATUS"
          echo "======================================"

          crave projects
          echo ""
          crave clone list

          echo ""
          echo "Project ID: $PROJECT_ID"
          echo "Project folder: $PROJECTFOLDER"

      - name: Configure Crave
        run: |
          set -e

          echo "======================================"
          echo "       CONFIGURING CRAVE"
          echo "======================================"

          echo "Using existing Project 99 / LOS 23.2"
          echo "Workspace: $PROJECTFOLDER"

          echo ""
          echo "Crave configuration:"
          crave projects

      - name: Build PixelOS Android 17
        run: |
          set -e

          echo "======================================"
          echo "      STARTING CRAVE BUILD"
          echo "======================================"

          crave run \
            --projectID "$PROJECT_ID" \
            --no-patch \
            -- bash -c '
              set -e

              echo "======================================"
              echo "     PIXELOS ANDROID 17 - FLAME"
              echo "======================================"

              cd /crave-devspaces/Lineage23

              echo ""
              echo "======================================"
              echo "1. PixelOS manifest"
              echo "======================================"

              repo init \
                -u https://github.com/PixelOS-AOSP/android_manifest \
                -b seventeen \
                --git-lfs \
                --depth=1

              echo ""
              echo "======================================"
              echo "2. Installing EXACT AsTechpro20 manifest"
              echo "======================================"

              rm -rf .repo/local_manifests

              git clone \
                --depth=1 \
                -b latest \
                https://github.com/AsTechpro20/local_manifests_flame.git \
                .repo/local_manifests

              echo ""
              echo "Manifest repository:"
              git -C .repo/local_manifests remote -v

              echo ""
              echo "Manifest branch:"
              git -C .repo/local_manifests branch --show-current

              echo ""
              echo "Manifest files:"
              ls -la .repo/local_manifests

              echo ""
              echo "======================================"
              echo "3. Verify local_manifests.xml"
              echo "======================================"

              cat .repo/local_manifests/local_manifests.xml

              echo ""
              echo "======================================"
              echo "4. Check for duplicate WLAN entry"
              echo "======================================"

              if grep -Rqs "path=\"hardware/qcom/wlan\"" .repo/local_manifests; then
                echo "ERROR: hardware/qcom/wlan was found in local manifest."
                echo "This manifest should NOT contain that project."
                exit 1
              fi

              echo "No hardware/qcom/wlan project in local manifest."

              echo ""
              echo "======================================"
              echo "5. Resync source"
              echo "======================================"

              /opt/crave/resync.sh

              echo ""
              echo "======================================"
              echo "6. Build environment"
              echo "======================================"

              . build/envsetup.sh

              echo ""
              echo "======================================"
              echo "7. Lunch"
              echo "======================================"

              lunch lineage_flame-bp4a-userdebug

              echo ""
              echo "======================================"
              echo "8. Install clean"
              echo "======================================"

              make installclean

              echo ""
              echo "======================================"
              echo "9. BUILDING PIXEL OS"
              echo "======================================"

              m bacon

              echo ""
              echo "======================================"
              echo "       PIXEL OS BUILD COMPLETE"
              echo "======================================"
            '

      - name: Build Result
        if: always()
        run: |
          echo "======================================"
          echo "             BUILD RESULT"
          echo "======================================"
          echo "ROM: PixelOS Android 17"
          echo "Device: flame"
          echo "Project: 99"
          echo "Workspace: /crave-devspaces/Lineage23"
          echo "Manifest: AsTechpro20/local_manifests_flame"
          echo "Manifest branch: latest"
          echo "======================================"
