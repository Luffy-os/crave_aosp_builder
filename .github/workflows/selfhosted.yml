name: PixelOS Android 17 Builder (self-hosted)

on:
  workflow_dispatch:
    inputs:

      PIXELOS_BRANCH:
        description: "PixelOS branch"
        required: true
        default: "seventeen"
        type: choice
        options:
          - "seventeen"

      CRAVE_PROJECT_ID:
        description: "Crave project ID"
        required: true
        default: "99"

      LOCAL_MANIFEST:
        description: "Local manifest repository URL"
        required: true
        default: "https://github.com/Luffy-os/local_manifests_flame"

      LOCAL_MANIFEST_BRANCH:
        description: "Local manifest branch"
        required: true
        default: "main"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "flame"

      PRODUCT_NAME:
        description: "Product name"
        required: true
        default: "lineage_flame"

      BUILD_COMMAND:
        description: "Build command"
        required: true
        default: "m bacon"

      BUILD_TYPE:
        description: "Build type"
        required: true
        default: "userdebug"
        type: choice
        options:
          - "userdebug"
          - "eng"
          - "user"

      CLEAN_BUILD:
        description: "Clean build?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

      REMOVALS:
        description: "Folders to remove before build"
        required: false
        default: ""


jobs:

  build:

    name: Build PixelOS Android 17

    runs-on: self-hosted

    timeout-minutes: 1440

    concurrency:
      group: ${{ github.repository_owner }}-pixelos-flame
      cancel-in-progress: false

    steps:

      - name: Checkout workflow repository
        uses: actions/checkout@v4


      - name: Set build variables
        shell: bash
        run: |
          set -e

          PROJECTID="${{ github.event.inputs.CRAVE_PROJECT_ID }}"
          PROJECTFOLDER="/crave-devspaces/Lineage23"

          BRANCH="${{ github.event.inputs.PIXELOS_BRANCH }}"
          MANIFEST="${{ github.event.inputs.LOCAL_MANIFEST }}"
          MANIFEST_BRANCH="${{ github.event.inputs.LOCAL_MANIFEST_BRANCH }}"
          PRODUCT="${{ github.event.inputs.PRODUCT_NAME }}"
          BUILD_TYPE="${{ github.event.inputs.BUILD_TYPE }}"

          BUILD_DIFFERENT_ROM="repo init -u https://github.com/PixelOS-AOSP/android_manifest -b ${BRANCH} --git-lfs --depth=1 --force-sync"

          LUNCH="lunch ${PRODUCT}-bp4a-${BUILD_TYPE}"

          if [[ "$MANIFEST" =~ \.xml/?$ ]]; then

            LOCAL_MANIFEST_URL="${MANIFEST%/}"

            LOCAL_MANIFEST="mkdir -p .repo/local_manifests && rm -f .repo/local_manifests/* && curl -L -o .repo/local_manifests/local_manifest.xml ${LOCAL_MANIFEST_URL}"

          else

            LOCAL_MANIFEST="git clone --depth=1 -b ${MANIFEST_BRANCH} ${MANIFEST} .repo/local_manifests"

          fi

          echo "PROJECTID=${PROJECTID}" >> "$GITHUB_ENV"
          echo "PROJECTFOLDER=${PROJECTFOLDER}" >> "$GITHUB_ENV"
          echo "BUILD_DIFFERENT_ROM=${BUILD_DIFFERENT_ROM}" >> "$GITHUB_ENV"
          echo "LUNCH=${LUNCH}" >> "$GITHUB_ENV"
          echo "LOCAL_MANIFEST=${LOCAL_MANIFEST}" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PixelOS Android 17 Configuration"
          echo "========================================"
          echo "Crave Project   : ${PROJECTID}"
          echo "Crave Path      : ${PROJECTFOLDER}"
          echo "PixelOS Branch  : ${BRANCH}"
          echo "Device          : ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Product         : ${PRODUCT}"
          echo "Build Type      : ${BUILD_TYPE}"
          echo "Lunch           : ${LUNCH}"
          echo "Build Command   : ${{ github.event.inputs.BUILD_COMMAND }}"
          echo "Manifest        : ${MANIFEST}"
          echo "Manifest Branch : ${MANIFEST_BRANCH}"
          echo "========================================"


      - name: Check self-hosted Crave environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking Crave environment"
          echo "========================================"

          echo "DCDEVSPACE=${DCDEVSPACE}"

          if [[ "$DCDEVSPACE" != *1* ]]; then
            echo "ERROR: This workflow must run on the self-hosted Crave runner."
            exit 1
          fi

          if ! command -v crave >/dev/null 2>&1; then
            echo "ERROR: crave command not found."
            exit 1
          fi

          echo "Crave environment OK."


      - name: Verify Crave clone
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking Crave clone"
          echo "========================================"

          crave clone list

          echo ""
          echo "Expected Project : ${PROJECTID}"
          echo "Expected Path    : ${PROJECTFOLDER}"
          echo ""

          if ! crave clone list --json \
            | jq -e --arg path "$PROJECTFOLDER" \
              '.clones[] | select(."Cloned At" == $path)' \
              >/dev/null; then

            echo "ERROR: Crave clone was not found."
            echo ""
            echo "Expected:"
            echo "Project 99"
            echo "/crave-devspaces/Lineage23"
            exit 1
          fi

          echo "Crave clone found."


      - name: Configure git
        shell: bash
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"


      - name: Configure Crave
        shell: bash
        run: |
          set -e

          if [[ ! -f "$HOME/crave.conf" ]]; then
            echo "ERROR: $HOME/crave.conf not found."
            exit 1
          fi

          cd "$PROJECTFOLDER"

          mkdir -p .repo/manifests

          if [[ -z "${{ secrets.CUSTOM_YAML }}" ]]; then

            curl -L \
              -o .repo/manifests/crave.yaml \
              https://raw.githubusercontent.com/sounddrill31/crave_aosp_builder/main/configs/crave/crave.yaml.aosp

            echo "Using default Crave configuration."

          else

            printf '%s\n' "${{ secrets.CUSTOM_YAML }}" \
              > .repo/manifests/crave.yaml

            echo "Using custom Crave configuration."

          fi

          echo "Crave configuration ready."


      - name: Telegram Build Started
        continue-on-error: true
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot$botToken/sendMessage" \
            -d chat_id="$chatId" \
            -d text="PixelOS Android 17 build started%0ADevice: ${{ github.event.inputs.DEVICE_NAME }}%0ABranch: ${{ github.event.inputs.PIXELOS_BRANCH }}%0AProject: $PROJECTID%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        env:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}


      - name: Start PixelOS Android 17 build
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Starting PixelOS Android 17 build"
          echo "========================================"

          echo "Crave Project : $PROJECTID"
          echo "Crave Path    : $PROJECTFOLDER"
          echo "PixelOS       : ${{ github.event.inputs.PIXELOS_BRANCH }}"
          echo "Device        : ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Product       : ${{ github.event.inputs.PRODUCT_NAME }}"
          echo "Lunch         : $LUNCH"
          echo "Build Command : ${{ github.event.inputs.BUILD_COMMAND }}"
          echo "========================================"

          cd "$PROJECTFOLDER"

          if [[ -f "$HOME/crave.conf" ]]; then

            jq '.projects = []' \
              "$HOME/crave.conf" \
              > "$HOME/crave.conf.tmp"

            mv "$HOME/crave.conf.tmp" "$HOME/crave.conf"

            echo "Cleared local Crave project overrides."

          fi


          if [[ "${{ github.event.inputs.CLEAN_BUILD }}" == "yes" ]]; then
            CLEAN="--clean"
          else
            CLEAN=""
          fi


          if [[ -n "${{ secrets.PAID }}" ]]; then
            PAID="--platform aosp-silver"
          else
            PAID=""
          fi


          echo "========================================"
          echo "Launching Crave"
          echo "========================================"


          crave ${{ secrets.CRAVE_FLAGS }} run \
            --no-patch \
            $PAID \
            $CLEAN \
            -- \
            "set -e && \
            echo '========================================' && \
            echo 'Preparing PixelOS Android 17' && \
            echo '========================================' && \
            rm -rf .repo/local_manifests && \
            ${BUILD_DIFFERENT_ROM} && \
            echo '========================================' && \
            echo 'Installing Flame local manifest' && \
            echo '========================================' && \
            ${LOCAL_MANIFEST} && \
            echo '========================================' && \
            echo 'Synchronizing PixelOS source' && \
            echo '========================================' && \
            if [ -f /opt/crave/resync.sh ]; then \
              /opt/crave/resync.sh; \
            elif [ -f /usr/bin/resync ]; then \
              /usr/bin/resync; \
            else \
              echo 'ERROR: Crave resync script not found.'; \
              exit 1; \
            fi && \
            echo '========================================' && \
            echo 'Source synchronization complete' && \
            echo '========================================' && \
            export BUILD_USERNAME='${{ github.actor }}' && \
            export BUILD_HOSTNAME=crave && \
            source build/envsetup.sh && \
            echo '========================================' && \
            echo 'PixelOS environment loaded' && \
            echo '========================================' && \
            ${LUNCH} && \
            echo '========================================' && \
            echo 'Lunch successful!' && \
            echo '========================================' && \
            echo 'Running make installclean...' && \
            make installclean && \
            echo '========================================' && \
            echo 'Starting PixelOS Android 17 build...' && \
            ${{ github.event.inputs.BUILD_COMMAND }}"


      - name: Show build information
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "PixelOS Android 17 build finished"
          echo "========================================"
          echo "Project : $PROJECTID"
          echo "Path    : $PROJECTFOLDER"
          echo "Device  : ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Branch  : ${{ github.event.inputs.PIXELOS_BRANCH }}"
          echo ""
          echo "Artifacts remain on the remote Crave build workspace."


      - name: Telegram Build Finished
        if: always()
        continue-on-error: true
        run: |

          if [[ "${{ job.status }}" == "success" ]]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot$botToken/sendMessage" \
            -d chat_id="$chatId" \
            -d text="PixelOS Android 17 build $STATUS%0ADevice: ${{ github.event.inputs.DEVICE_NAME }}%0ABranch: ${{ github.event.inputs.PIXELOS_BRANCH }}%0AProject: $PROJECTID%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        env:
          chatId: ${{ secrets.TELEGRAM_TO }}
          botToken: ${{ secrets.TELEGRAM_TOKEN }}
