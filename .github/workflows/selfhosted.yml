name: PixelOS 17 - Redmi 14C 5G (flame)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-runner:
    name: Start existing Crave runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y tmux gettext-base

      - name: Configure Crave CLI
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CRAVE_USERNAME" || { echo "::error::Missing CRAVE_USERNAME secret"; exit 1; }
          test -n "$CRAVE_TOKEN" || { echo "::error::Missing CRAVE_TOKEN secret"; exit 1; }
          curl -fsSL https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          test -f ./crave
          test -f ./crave.conf.sample
          mkdir -p "$HOME/bin"
          mv ./crave "$HOME/bin/crave"
          sudo ln -sf "$HOME/bin/crave" /usr/bin/crave
          envsubst < ./crave.conf.sample > ./crave.conf
          chmod 600 ./crave.conf
          crave version

      - name: Start GitHub runner in Crave devspace
        env:
          CRAVE_FLAGS: ${{ secrets.CRAVE_FLAGS }}
        run: |
          set -euo pipefail
          cat > /tmp/start-runner.sh <<'REMOTE_SCRIPT'
          set -euo pipefail
          test -f actions-runner/run.sh || {
            echo "ERROR: actions-runner/run.sh not found in the Crave devspace."
            echo "Install and configure the GitHub self-hosted runner there first."
            exit 1
          }
          if tmux has-session -t ghactions 2>/dev/null; then
            echo "Existing ghactions tmux session is running."
          else
            tmux new-session -d -s ghactions "cd actions-runner && ./run.sh"
            echo "Started GitHub runner in tmux."
          fi
          sleep 3
          tmux has-session -t ghactions
          tmux capture-pane -pt ghactions -S -25 || true
          REMOTE_SCRIPT
          SCRIPT_B64="$(base64 -w0 /tmp/start-runner.sh)"
          if [ -n "$CRAVE_FLAGS" ]; then
            crave $CRAVE_FLAGS devspace -- "echo $SCRIPT_B64 | base64 -d | bash"
          else
            crave devspace -- "echo $SCRIPT_B64 | base64 -d | bash"
          fi

  build:
    name: Sync and build PixelOS 17 for flame
    needs: start-runner
    runs-on: self-hosted
    timeout-minutes: 1440
    concurrency:
      group: pixelos17-flame
      cancel-in-progress: false
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Verify Crave workspace and CLI
        run: |
          set -euo pipefail
          command -v crave
          test -d /crave-devspaces/PixelOS
          test -d /crave-devspaces/PixelOS/.repo
          test -f /crave-devspaces/PixelOS/build/envsetup.sh
          echo "Crave CLI and PixelOS clone found."

      - name: Queue source sync and compilation
        env:
          CRAVE_FLAGS: ${{ secrets.CRAVE_FLAGS }}
        run: |
          set -euo pipefail
          cd /crave-devspaces/PixelOS
          cat > /tmp/pixelos-flame-build.sh <<'REMOTE_SCRIPT'
          set -euo pipefail
          echo "========================================"
          echo " PixelOS 17 / Redmi 14C 5G / flame"
          echo "========================================"
          echo "1. Creating local manifest..."
          mkdir -p .repo/local_manifests
          printf '%s' '' | base64 -d > .repo/local_manifests/flame.xml
          echo "2. Validating manifest..."
          test -s .repo/local_manifests/flame.xml
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse(".repo/local_manifests/flame.xml"); print("Manifest XML: OK")'
          echo "3. Checking repository entries..."
          grep -q 'flame4blame/android_device_xiaomi_flame' .repo/local_manifests/flame.xml
          grep -q 'flame4blame/android_device_xiaomi_flame-kernel' .repo/local_manifests/flame.xml
          grep -q 'flame4blame/proprietary_vendor_xiaomi_flame' .repo/local_manifests/flame.xml
          echo "4. Syncing through Crave..."
          if [ -x /usr/bin/resync ]; then
            /usr/bin/resync
          elif [ -x /opt/crave/resync.sh ]; then
            /opt/crave/resync.sh
          else
            echo "ERROR: Crave resync helper not found."
            exit 1
          fi
          echo "5. Verifying device/kernel/vendor source folders..."
          test -d device/xiaomi/flame
          test -d device/xiaomi/flame-kernel
          test -d vendor/xiaomi/flame
          echo "6. Loading build environment..."
          source build/envsetup.sh
          echo "7. Checking PixelOS build target..."
          lunch custom_flame-cp2a-userdebug
          echo "8. Compiling PixelOS..."
          m pixelos
          echo "PixelOS build command completed."
          REMOTE_SCRIPT
          sed -i 's|||' /tmp/pixelos-flame-build.sh
          SCRIPT_B64="$(base64 -w0 /tmp/pixelos-flame-build.sh)"
          echo "Submitting sync/build to Crave project ID 82..."
          if [ -n "$CRAVE_FLAGS" ]; then
            crave $CRAVE_FLAGS run --projectID 82 --no-patch -- "echo $SCRIPT_B64 | base64 -d | bash"
          else
            crave run --projectID 82 --no-patch -- "echo $SCRIPT_B64 | base64 -d | bash"
          fi

      - name: Show Crave error log if build failed
        if: failure()
        run: |
          cd /crave-devspaces/PixelOS 2>/dev/null || exit 0
          echo "===== Pulling Crave error.log ====="
          crave pull out/error.log || true
          if [ -f out/error.log ]; then
            tail -n 250 out/error.log
          else
            echo "out/error.log is not available in this workspace."
          fi

      - name: Stop Crave jobs on cancellation
        if: cancelled()
        run: |
          crave stop --all || true
