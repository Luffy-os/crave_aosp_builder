name: PixelOS 17 - flame (Crave)

on:
  workflow_dispatch:

jobs:
  start-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq gettext-base

      - name: Configure Crave
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        run: |
          set -e
          if [[ "$DCDEVSPACE" == *1* ]]; then
            echo "Already inside Crave devspace"
          else
            mkdir -p "$HOME/bin"
            curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
            test -f ./crave
            mv ./crave "$HOME/bin/crave"
            sudo ln -sf "$HOME/bin/crave" /usr/bin/crave
            test -f ./crave.conf.sample
            envsubst < ./crave.conf.sample > ./crave.conf
          fi
          crave version

      - name: Start self-hosted runner in Crave
        env:
          CRAVE_FLAGS: ${{ secrets.CRAVE_FLAGS }}
        run: |
          set -e
          crave $CRAVE_FLAGS devspace -- '
            set -e
            test -f actions-runner/run.sh
            if tmux has-session -t ghactions 2>/dev/null; then
              tmux kill-session -t ghactions
            fi
            tmux new-session -d -s ghactions "./actions-runner/run.sh"
            sleep 5
            test -f actions-runner/.runner || true
            pgrep -af Runner.Listener || true
          '

  build:
    needs: start-runner
    runs-on: self-hosted
    timeout-minutes: 1440
    concurrency:
      group: pixelos-flame
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Crave PixelOS clone
        run: |
          set -e
          test -d /crave-devspaces/PixelOS
          test -d /crave-devspaces/PixelOS/.repo
          echo "PixelOS Crave clone is ready."

      - name: Run PixelOS 17 flame build
        env:
          CRAVE_FLAGS: ${{ secrets.CRAVE_FLAGS }}
        run: |
          set -e
          cd /crave-devspaces/PixelOS

          crave $CRAVE_FLAGS run --projectID 82 --no-patch -- "
            set -e

            echo '========================================'
            echo ' PixelOS 17 / Redmi 14C 5G / flame'
            echo '========================================'

            echo '1. Creating local manifest...'
            mkdir -p .repo/local_manifests
            printf '%s' '' | base64 -d > .repo/local_manifests/flame.xml

            echo '2. Validating manifest...'
            test -s .repo/local_manifests/flame.xml
            python3 -c 'import xml.etree.ElementTree as ET; ET.parse(\".repo/local_manifests/flame.xml\"); print(\"Manifest XML: OK\")'

            echo '3. Checking manifest repositories...'
            grep -q 'flame4blame/android_device_xiaomi_flame' .repo/local_manifests/flame.xml
            grep -q 'flame4blame/android_device_xiaomi_flame-kernel' .repo/local_manifests/flame.xml
            grep -q 'flame4blame/proprietary_vendor_xiaomi_flame' .repo/local_manifests/flame.xml
            echo 'Manifest repository checks: OK'

            echo '4. Syncing device sources...'
            if [ -x /usr/bin/resync ]; then
              /usr/bin/resync
            else
              /opt/crave/resync.sh
            fi

            echo '5. Checking required source directories...'
            test -d device/xiaomi/flame
            test -d device/xiaomi/flame-kernel
            test -d vendor/xiaomi/flame
            echo 'Device/kernel/vendor sources: OK'

            echo '6. Loading Android build environment...'
            source build/envsetup.sh

            echo '7. Checking PixelOS target...'
            lunch custom_flame-cp2a-userdebug

            echo 'PixelOS target: OK'
            echo '8. Starting compilation...'
            m pixelos

            echo '========================================'
            echo ' PixelOS compilation command completed'
            echo '========================================'
          "

      - name: Verify ROM output
        if: success()
        run: |
          set -e
          cd /crave-devspaces/PixelOS
          echo "Build completed. Searching for ROM..."
          test -d out/target/product/flame
          find out/target/product/flame -maxdepth 1 -type f \( -name 'PixelOS_*.zip' -o -name '*.zip' \) -print

      - name: Show Crave error log
        if: failure()
        run: |
          cd /crave-devspaces/PixelOS
          echo "===== Crave error.log ====="
          if [ -f out/error.log ]; then
            cat out/error.log
          else
            echo "out/error.log not found"
          fi

      - name: Stop Crave jobs on cancellation
        if: cancelled()
        run: |
          cd /crave-devspaces/PixelOS
          crave stop --all || true
