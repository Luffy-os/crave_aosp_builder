name: PixelOS Android 17 - Flame

on:
  workflow_dispatch:

concurrency:
  group: pixelos-flame
  cancel-in-progress: false

jobs:
  build:
    name: Build PixelOS Android 17
    runs-on: self-hosted
    timeout-minutes: 1440

    env:
      PROJECT_ID: "99"
      PROJECTFOLDER: "/crave-devspaces/Lineage23"

    steps:

      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Check Crave
        run: |
          set -e

          echo "========================================"
          echo "             CRAVE STATUS"
          echo "========================================"

          echo ""
          echo "Available Crave projects/clones:"
          crave clone list

          echo ""
          echo "Target:"
          echo "Project ID : $PROJECT_ID"
          echo "Workspace  : $PROJECTFOLDER"

      - name: Build PixelOS Android 17
        run: |
          set -e

          echo "========================================"
          echo "       STARTING PIXELOS BUILD"
          echo "========================================"

          cd "$PROJECTFOLDER"

          crave run --no-patch -- "
            set -e

            echo '========================================'
            echo '     PIXELOS ANDROID 17 - FLAME'
            echo '========================================'

            echo ''
            echo '1. Initializing PixelOS Android 17'

            repo init \
              -u https://github.com/PixelOS-AOSP/android_manifest \
              -b seventeen \
              --git-lfs \
              --depth=1

            echo ''
            echo '2. Installing AsTechpro20 local manifest'

            rm -rf .repo/local_manifests

            git clone \
              --depth=1 \
              -b latest \
              https://github.com/AsTechpro20/local_manifests_flame.git \
              .repo/local_manifests

            echo ''
            echo '3. Verifying manifest repository'

            git -C .repo/local_manifests remote -v

            echo ''
            echo 'Manifest branch:'
            git -C .repo/local_manifests branch --show-current

            echo ''
            echo 'Manifest contents:'
            ls -la .repo/local_manifests

            echo ''
            echo '========================================'
            echo '       LOCAL MANIFEST'
            echo '========================================'

            cat .repo/local_manifests/local_manifests.xml

            echo ''
            echo '========================================'
            echo '       CHECKING WLAN DUPLICATE'
            echo '========================================'

            if grep -Rqs 'path=\"hardware/qcom/wlan\"' .repo/local_manifests; then
              echo 'ERROR: hardware/qcom/wlan exists in AsTechpro20 local manifest.'
              exit 1
            fi

            echo 'OK: no hardware/qcom/wlan project in local manifest.'

            echo ''
            echo '4. Resyncing source'

            /opt/crave/resync.sh

            echo ''
            echo '5. Loading Android build environment'

            . build/envsetup.sh

            echo ''
            echo '6. Lunch'

            lunch lineage_flame-bp4a-userdebug

            echo ''
            echo '7. Install clean'

            make installclean

            echo ''
            echo '========================================'
            echo '       STARTING PIXEL OS BUILD'
            echo '========================================'

            m bacon

            echo ''
            echo '========================================'
            echo '       BUILD COMPLETED'
            echo '========================================'
          "

      - name: Build Result
        if: always()
        run: |
          echo "========================================"
          echo "             BUILD RESULT"
          echo "========================================"
          echo "ROM      : PixelOS Android 17"
          echo "Device   : flame"
          echo "Project  : 99"
          echo "Workspace: /crave-devspaces/Lineage23"
          echo "Manifest : AsTechpro20/local_manifests_flame"
          echo "Branch   : latest"
          echo "========================================"
